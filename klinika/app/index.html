<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-T2dmvpJTdpqW8lHMyslD0n2S/Rc5eS4gEkh6JguDHT0='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#3B5BDB">
<meta name="description" content="Kirenix Клиника: протокол приёма, план лечения и рекомендации. Данные пациентов хранятся только на компьютере клиники.">
<title>Kirenix Клиника</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Kirenix Клиника — рабочая версия для одного специалиста. Стили выросли из демо: те же цвета, карточки и бланки клиники. */
:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --surface-2:#EEF1F8; --text:#1A1A2E; --muted:#5E6476; --border:#DDE1EC;
  --accent:#3B5BDB; --accent-weak:#E8EDFF; --accent-ink:#2C46B8; --on-accent:#FFFFFF;
  --ok:#2E7D32; --ok-weak:#E5F3E6; --warn:#9A5800; --warn-weak:#FFF1DC; --danger:#C62828; --danger-weak:#FCE9E9;
  --face:#AEB5C6; --paper:#FFFFFF; --paper-ink:#1A1A2E; --paper-line:#C9CEDA; --shadow:0 1px 2px rgba(26,26,46,.06),0 4px 16px rgba(26,26,46,.06);
  --gold:#A8844F; --gold-ink:#5B4C38; --gold-soft:#8A7454; --blank-ink:#231C14; --paper-muted:#6A6F80;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111320; --surface:#191C2B; --surface-2:#22263A; --text:#E7E9F3; --muted:#A3A9BD; --border:#2F3449;
    --accent:#8197F2; --accent-weak:#252D50; --accent-ink:#B4C3FF; --on-accent:#0E1224;
    --ok:#7BC77F; --ok-weak:#1D2F22; --warn:#E5A453; --warn-weak:#35291A; --danger:#F08383; --danger-weak:#3A2026;
    --face:#596079; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);min-height:100vh}
body.modal-open{overflow:hidden}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:22px} h2{font-size:20px} h3{font-size:15px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* шапка */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:9px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand > div:last-child{min-width:0;display:flex;flex-direction:column}
.brand b{font-size:16px;letter-spacing:.01em}
.brand .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.top-actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.save-state{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.save-state .dot{width:7px;height:7px}
.save-state.ok{color:var(--ok)} .save-state.pending{color:var(--muted)} .save-state.err{color:var(--danger);font-weight:700}
.who-am-i{font-size:13px;color:var(--muted);white-space:nowrap}

main{padding-block:18px 40px}
.foot{padding-block:0 24px;color:var(--muted);font-size:12px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;margin-bottom:14px}
.page-head p{color:var(--muted);font-size:13px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.card-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-start;justify-content:space-between}
.card-head > div{min-width:0;flex:1 1 260px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row.end{justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-weak);color:var(--ok)}
.chip.warn{background:var(--warn-weak);color:var(--warn)}
.chip.bad{background:var(--danger-weak);color:var(--danger)}
.chip.neutral{background:var(--surface-2);color:var(--muted)}
.chip.info{background:var(--accent-weak);color:var(--accent-ink)}
.chip.kind{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--border)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.btn{border:1px solid var(--border);background:var(--surface);padding:8px 13px;border-radius:9px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn svg{flex:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:6px}
.btn-ghost:hover{color:var(--text);border-color:transparent}
.btn-danger{color:var(--danger)}
.btn-danger:hover{border-color:var(--danger)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.wide{width:100%}
.lock{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13px;color:var(--muted)}
.lock svg{flex:none;margin-top:1px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
label.field > span.req::after{content:" *";color:var(--danger)}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=password],input[type=tel],select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);width:100%;min-width:0}
input[type=date]{min-height:38px}
input[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger) inset}
textarea{resize:vertical;min-height:84px;line-height:1.45}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted)}
.err-text{color:var(--danger);font-size:13px;font-weight:600}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:12px;background:var(--warn-weak);color:var(--warn);margin-bottom:14px;font-size:13.5px}
.banner b{font-weight:700}
.banner.bad{background:var(--danger-weak);color:var(--danger)}
.banner.info{background:var(--accent-weak);color:var(--accent-ink)}

/* вход и первая настройка */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gate .card{width:min(460px,100%);padding:22px 22px 20px;box-shadow:var(--shadow)}
.gate-brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.gate-brand .logo{width:40px;height:40px;font-size:20px;border-radius:11px}
.gate-brand b{display:block;font-size:18px}
.gate h2{font-size:18px;margin-bottom:6px}
.gate .stack{gap:12px}
.steps-dots{display:flex;gap:6px;margin-bottom:14px}
.steps-dots span{height:4px;flex:1;border-radius:4px;background:var(--surface-2)}
.steps-dots span.on{background:var(--accent)}
.pin-input{font-size:22px!important;letter-spacing:.35em;text-align:center;font-family:var(--mono)}
.secret{-webkit-text-security:disc}
.devno{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;padding:10px 14px}
.devno b{font-size:22px;letter-spacing:.12em;color:var(--text)}
.kv{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.kv b{font-size:15px;color:var(--text)}
#act-code{font-size:13px;word-break:break-all;resize:vertical}
.gate .linkish{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.fatal{max-width:560px}

/* главный экран */
.split{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:16px;align-items:start}
.list-col{position:sticky;top:70px}
.side-sec{display:flex;flex-direction:column;gap:8px}
.side-sec h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.visit-list{display:flex;flex-direction:column;gap:8px}
.visit{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 10px;text-align:left;width:100%;border:1px solid var(--border);background:var(--surface);border-radius:11px;padding:10px 12px;color:var(--text)}
.visit:hover{border-color:var(--accent)}
.visit[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.visit .t{font-weight:700;font-variant-numeric:tabular-nums}
.visit .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.visit .meta{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.visit.hit{grid-template-columns:minmax(0,1fr)}
.visit.hit .meta{grid-column:1}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.back{display:none}
.welcome h2{margin-bottom:6px}
.welcome ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.stats{display:flex;flex-wrap:wrap;gap:8px}

/* карта пациента */
.patient-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.patient-head > div:first-child{min-width:0}
.patient-head h2{overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kv{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.hist{display:flex;flex-direction:column;gap:8px;font-size:13px}
.hist-item{padding:9px 10px;border-radius:9px;background:var(--surface-2);text-align:left;border:1px solid transparent;width:100%;color:var(--text)}
button.hist-item:hover{border-color:var(--accent)}
.hist-item .said{display:block;margin-top:3px;font-size:12.5px}
.start-visit{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.start-visit label{flex:1 1 220px}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.form-grid .span2{grid-column:span 2}
.form-grid .span3{grid-column:1/-1}
.checkline{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.checkline input{margin-top:3px}
.again{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding:11px 12px;border-radius:10px;background:var(--accent-weak);color:var(--accent-ink);margin-bottom:6px}
.again > div{min-width:0;flex:1 1 230px}
.again b{display:block;margin-bottom:1px}
.again .small{display:block}
.again.done{background:var(--ok-weak);color:var(--ok)}

/* протокол */
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:14px 0;border-top:1px solid var(--border)}
.step:first-child{border-top:0;padding-top:4px}
.step-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.step.done .step-n{background:var(--ok-weak);color:var(--ok)}
.step h3{margin-bottom:8px}
.checks{display:flex;flex-direction:column;gap:7px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.checks input{margin-top:3px}
.grid3{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:10px}
.mapwrap{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:16px;align-items:start}
.facemap{width:100%;max-width:230px;height:auto;border:1px dashed var(--border);border-radius:12px;background:var(--surface-2);cursor:crosshair;touch-action:manipulation}
.pts{display:flex;flex-direction:column;gap:6px}
.pt{display:grid;grid-template-columns:24px minmax(0,1fr) 96px 28px;gap:8px;align-items:center;font-size:13px}
.pt .num-badge{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:11px;font-weight:700}
.pt input{padding:5px 8px}
.total{font-weight:700}
.tpl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tpl .tpl-h{width:100%;font-size:12px;color:var(--muted)}
.tpl button{border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 9px;font-size:13px;line-height:1.35;text-align:left;max-width:100%;color:var(--text)}
.tpl button b{color:var(--accent-ink)}
.tpl button:hover,.tpl button.on{border-color:var(--accent);background:var(--accent-weak)}
.finish{position:sticky;bottom:10px;margin-top:14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.finish .msg{font-size:13px;min-width:0;flex:1 1 260px}
.finish .msg b{display:block;margin-bottom:2px}
.donebar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--ok-weak);color:var(--ok);font-weight:600;margin-top:14px}
.donebar > span{display:flex;gap:8px;align-items:center;min-width:0;flex:1 1 260px}
.ro-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;background:var(--surface-2);border-radius:8px;padding:8px 10px}

/* план лечения и рекомендации */
.ptype{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.radio-seg{display:flex;flex-wrap:wrap;gap:6px}
.radio-seg label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;background:var(--surface)}
.radio-seg label:has(input:checked){border-color:var(--accent);background:var(--accent-weak);color:var(--accent-ink);font-weight:600}
.radio-seg input{margin:0;accent-color:var(--accent)}
.ptype .from{flex:0 1 170px}
.prows{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;gap:6px;align-items:center}
.prow.plan{grid-template-columns:minmax(0,150px) minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.2fr) 34px}
.prow.dir{grid-template-columns:minmax(0,150px) minmax(0,1fr) 34px}
.prow.cosm{grid-template-columns:minmax(0,1.15fr) minmax(0,1.35fr) 34px}
.prow.head{font-size:12px;font-weight:600;color:var(--muted)}
.prow .cell{display:flex;flex-direction:column;min-width:0}
.prow .lbl{display:none}
.prow input{padding:6px 8px}
.prow .del{padding:6px 8px;font-size:18px;line-height:1}
.prow .del-t{display:none}
.sub-h{font-size:13.5px;font-weight:700;margin-top:4px}
.linked{font-size:12.5px;color:var(--muted)}
details.old summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
details.old .list{margin-top:8px}
.list{display:flex;flex-direction:column;gap:8px;font-size:13px}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--surface-2)}
.li > div{min-width:0}

/* настройки */
.settings{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;align-items:start}
.snav{display:flex;flex-direction:column;gap:4px;position:sticky;top:118px}
.snav button{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:9px;font-weight:600;color:var(--muted)}
.snav button[aria-current="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sgrid .span2{grid-column:1/-1}
.img-pick{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.img-pick .prev{width:120px;height:56px;border:1px dashed var(--border);border-radius:8px;display:grid;place-items:center;background:var(--surface-2);overflow:hidden;color:var(--muted);font-size:12px}
.img-pick .prev img{max-width:100%;max-height:100%;object-fit:contain}
.img-pick .prev.sq{width:64px;height:64px}
.file{position:relative;overflow:hidden;display:inline-flex}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.proc{border:1px solid var(--border);border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:10px}
.proc-grid{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px}
.flags{display:flex;flex-wrap:wrap;gap:6px 16px}
.flags label{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.danger-zone{border-color:var(--danger)}

/* окно с бланком */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(14,16,28,.55);display:flex;align-items:flex-start;justify-content:center;padding:16px 12px;overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:min(860px,100%);box-shadow:var(--shadow);border:1px solid var(--border)}
.modal:focus{outline:none}
.modal-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-head > div:first-child{min-width:0}
.modal-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--border);background:var(--surface);padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent);color:var(--accent-ink)}
.paper-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:6px}

/* бумага: общие */
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:6px;padding:26px 28px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:13.5px;line-height:1.45;min-width:620px}
.paper h4{margin:0 0 2px;font-size:16px}
.paper .sub{font-size:12.5px;color:var(--paper-muted);margin-bottom:14px}
.paper .lineitem{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:4px 12px;padding:4px 0;border-bottom:1px solid var(--paper-line)}
.paper .filled{font-weight:600;overflow-wrap:anywhere}
.paper .sec{margin-top:12px;break-inside:avoid}
.paper .sec b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--paper-muted);margin-bottom:3px}
.paper .sec p{white-space:pre-wrap;overflow-wrap:anywhere}
.paper .sign{display:flex;justify-content:space-between;gap:20px;margin-top:26px;font-size:13px}
.paper .rec-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-bottom:10px;border-bottom:1px solid var(--paper-line);margin-bottom:12px}
.paper .rec-top img{max-height:40px;max-width:150px;object-fit:contain}
.paper .rec-map{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:start}
.paper .rec-map svg{width:150px;height:auto}
.paper .rec-map ol{margin:0;padding-left:20px;columns:2;column-gap:24px;font-size:12.5px}
.paper.memo ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.paper .foot-note{margin-top:16px;font-size:11.5px;color:var(--paper-muted)}

/* бланки клиники: тонкие золотые линии, капитель, круглые отметки — как на их бумаге */
.paper.blank{color:var(--blank-ink);font-size:13px;line-height:1.4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bl-head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px 14px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--gold)}
.bl-l{justify-self:start;min-width:0}
.bl-l img{max-width:150px;max-height:48px;object-fit:contain;display:block}
.bl-name{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-ink)}
.bl-title{font-size:20px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-align:center;white-space:nowrap}
.bl-care{justify-self:end;display:flex;gap:8px;align-items:center;font-size:10.5px;line-height:1.35;color:var(--gold-ink);text-align:right}
.bl-care img{width:48px;height:48px;object-fit:contain;flex:none}
.bl-opts{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.bl-opt{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.bl-opt i{width:12px;height:12px;border:1px solid var(--gold);border-radius:50%;display:inline-block;position:relative;flex:none}
.bl-opt.on i::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--blank-ink)}
.bl-from{margin-left:auto;display:inline-flex;gap:6px;align-items:baseline;white-space:nowrap}
.bl-line{display:inline-block;min-width:110px;border-bottom:1px solid var(--gold);text-align:center;font-weight:600;text-transform:none;letter-spacing:0;font-size:13px;padding:0 4px}
.bl-fio{display:flex;gap:10px;align-items:baseline;margin-top:14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.bl-fio > span:first-child{white-space:nowrap}
.bl-fio .bl-line{flex:1;text-align:left;min-width:0}
.bl-sec{margin-top:18px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.paper.blank table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px;table-layout:fixed}
.paper.blank th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;text-align:center;color:var(--gold-ink);vertical-align:middle;padding:6px 4px;overflow-wrap:anywhere;border:1px solid var(--gold)}
.paper.blank td{border:1px solid var(--gold);height:26px;padding:4px 6px;overflow-wrap:anywhere;vertical-align:top}

/* разделы, «крошки», списки */
.top .mainnav{justify-content:flex-start}
.mainnav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-top:0!important;padding-bottom:0!important}
.mainnav::-webkit-scrollbar{display:none}
.mainnav button{border:0;background:transparent;padding:9px 14px 10px;font-weight:600;font-size:14.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.mainnav button:hover{color:var(--text)}
.mainnav button[aria-current="page"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.nav-badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--warn-weak);color:var(--warn);font-size:11.5px;font-weight:700;display:inline-grid;place-items:center}
.top-actions .btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-weak);color:var(--accent-ink)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:13.5px;margin:0 0 12px;color:var(--muted)}
.crumbs button{border:0;background:none;padding:2px 2px;color:var(--accent-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.crumbs .sep{color:var(--muted)}
.crumbs [aria-current]{color:var(--text);font-weight:600}
.page-head h1{font-size:24px}
.btn-lg{padding:11px 18px;font-size:15px;border-radius:11px}
.vlist,.plist{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:4px 14px;align-items:center;text-align:left;width:100%;border:1px solid var(--border);background:var(--surface);border-radius:11px;padding:11px 14px;color:var(--text)}
.vrow:hover,.pat-row:hover,.proc-btn:hover{border-color:var(--accent)}
.vr-t{font-weight:700;font-variant-numeric:tabular-nums}
.vr-t small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.vr-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.vr-main b{overflow-wrap:anywhere}
.pat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;text-align:left;width:100%;border:1px solid var(--border);background:var(--surface);border-radius:11px;padding:11px 14px;color:var(--text)}
.pr-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.pr-name b{overflow-wrap:anywhere}
.pr-last{text-align:right}
.day-sec{margin-top:18px}
.day-sec h2{font-size:16px;margin-bottom:10px}
.day-sec.warn h2{color:var(--warn)}
.day-sec .note{margin:-4px 0 8px}
.empty-state{text-align:center;padding:34px 20px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty-state p{max-width:520px;color:var(--muted)}
.wizard{max-width:760px}
.wizard-head{display:flex;flex-direction:column;gap:4px}
.wz-step{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink)}
.wizard-head h2{font-size:21px}
.proc-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.proc-btn{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:12px;padding:14px 15px;color:var(--text);min-height:64px}
.proc-btn b{font-size:15px}
.proc-btn .small{color:var(--accent-ink)}
.new-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding:12px 14px;border-radius:11px;background:var(--surface-2);font-weight:600}
.jfilter{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
.jday{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 8px}
.done-panel{border:2px solid var(--ok);background:var(--ok-weak);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.dp-head{display:flex;gap:10px;align-items:flex-start;color:var(--ok)}
.dp-head svg{flex:none;width:24px;height:24px;margin-top:1px}
.dp-head b{display:block;font-size:18px}
.dp-head span{display:block;color:var(--text);font-size:13.5px;margin-top:2px}
.dp-title{font-weight:700;font-size:15px}
.dp-steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.dp-steps li{padding-left:2px}
.dp-steps li > span{margin-right:10px}
.dp-steps li .btn{vertical-align:middle;margin-top:2px}
.dp-foot{padding-top:4px;border-top:1px solid color-mix(in srgb,var(--ok) 30%,transparent)}

/* настройки: плитки разделов, пояснения, процедуры свёрнуты */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:16px 18px;color:var(--text);min-height:112px}
.tile:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.tile b{font-size:16px}
.tile span{font-size:13px;color:var(--muted);line-height:1.45}
.howto{font-size:13px;color:var(--muted);padding:9px 12px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 8px 8px 0}
details.proc{padding:0}
details.proc > summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:12px 14px}
details.proc > summary::-webkit-details-marker{display:none}
details.proc > summary::before{content:"▸";color:var(--muted);font-size:12px}
details.proc[open] > summary::before{content:"▾"}
details.proc[open] > summary{border-bottom:1px solid var(--border)}
.proc-body{padding:12px 14px 14px}
.gate .linkish,.linkish{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:600;font-size:inherit;text-decoration:underline;text-underline-offset:2px}

/* карта пациента */
.pcard-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 16px}
.pcard-head h1{font-size:24px;overflow-wrap:anywhere}
.pcard-head p{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.ptabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--border)}
.ptabs button{border:0;background:none;padding:9px 13px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.ptabs button[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sec-h{font-size:16px}
.alert-allergy{border:1px solid var(--danger);background:var(--danger-weak);color:var(--danger);border-radius:10px;padding:9px 12px;font-size:14px;overflow-wrap:anywhere}

/* препараты, отчёты, документы */
.vrow.batch .vr-t{font-weight:600;font-size:12px;color:var(--muted)}
.vrow.batch .vr-t small{font-size:13px;color:var(--text);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:6px 0 4px}
.kpis div{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--surface-2);display:flex;flex-direction:column}
.kpis b{font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpis span{font-size:12.5px;color:var(--muted)}
.rep-h{font-size:15px;margin-top:10px}
table.rep{width:100%;border-collapse:collapse;font-size:13.5px}
table.rep th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--border)}
table.rep td{padding:8px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
table.rep td:first-child{font-weight:600}
.rep-period{max-width:280px}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.doc-card{justify-content:space-between}
.doc-card select{width:auto;flex:1 1 180px}
.paper.report h4{margin-bottom:10px}
.paper.report table.rep th,.paper.report table.rep td{border-bottom:1px solid var(--paper-line)}
.paper.report .kpis div{background:#fff;border-color:var(--paper-line)}

/* согласия на подпись */
.paper.doc{font-size:13px;line-height:1.55}
.paper.doc .doc-title{text-align:center;text-transform:uppercase;letter-spacing:.05em;font-size:15px;margin:6px 0 16px;line-height:1.35}
.paper.doc p{margin:0 0 7px;text-align:justify}
.paper.doc .sign{margin-top:30px}
.fill-line{display:inline-block;max-width:100%;border-bottom:1px solid currentColor;height:1.05em;vertical-align:-2px}
.paper .hint{font-size:11px;color:var(--paper-muted)}

/* инструкция «Как работать» */
.guide{max-width:860px;line-height:1.55}
.guide h2{font-size:22px;margin-bottom:8px}
.guide p{margin:0 0 8px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:14px 0 4px}
.flow-box{border:1px solid var(--border);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:190px;background:var(--surface-2)}
.flow-box b{font-size:15px}
.flow-box span{font-size:12.5px;color:var(--muted)}
.flow-box.accent{background:var(--accent-weak);border-color:var(--accent)}
.flow-arrow{font-size:13px;color:var(--muted);font-weight:600}
.g-sec{margin-top:24px}
.g-sec h3{break-after:avoid}
.g-sec h3{font-size:17px;margin-bottom:10px}
.g-steps{counter-reset:g;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.g-steps > li{counter-increment:g;position:relative;padding-left:40px;break-inside:avoid}
.g-steps > li::before{content:counter(g);position:absolute;left:0;top:-1px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.g-steps ul,.g-sec > ul{margin:6px 0 4px;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.kb{display:inline-block;border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:0 8px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.6}
.kb.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
/* в печати всегда светлые цвета, даже если на компьютере тёмная тема */
#print-root{--bg:#fff;--surface:#fff;--surface-2:#EEF1F8;--text:#1A1A2E;--muted:#5E6476;--border:#C9CEDA;--accent:#3B5BDB;--accent-weak:#E8EDFF;--accent-ink:#2C46B8;--on-accent:#fff;color-scheme:light}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;max-width:min(560px,calc(100% - 32px));box-shadow:var(--shadow)}
#print-root{display:none}

@media (max-width:980px){
  .proc-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .settings{grid-template-columns:minmax(0,1fr)}
  .snav{position:static;flex-direction:row;flex-wrap:wrap}
}
@media (max-width:860px){
  .split{grid-template-columns:minmax(0,1fr)}
  .list-col{position:static}
  .split.has-sel .list-col{display:none}
  .split:not(.has-sel) .detail-col{display:none}
  .back{display:inline-flex;align-self:flex-start}
  .facts{grid-template-columns:minmax(0,1fr)}
  .form-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .form-grid .span2{grid-column:1/-1}
}
@media (max-width:640px){
  .pgrid{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles,.doc-grid{grid-template-columns:minmax(0,1fr)}
  .vrow{grid-template-columns:58px minmax(0,1fr)}
  .vr-st{grid-column:2}
  .pat-row{grid-template-columns:minmax(0,1fr)}
  .pr-last{text-align:left}
  .jfilter{grid-template-columns:minmax(0,1fr)}
  .btn-lg{width:100%}
  .page-head > .btn{width:100%}
  .mainnav button{padding:9px 10px 10px;font-size:14px}
  .prow.plan{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:end;padding:10px;border:1px solid var(--border);border-radius:10px}
  .prow.plan .cell:nth-child(1){order:1}
  .prow.plan .cell:nth-child(3){order:2}
  .prow.plan .cell:nth-child(2){order:3;grid-column:1/-1}
  .prow.plan .cell:nth-child(4){order:4;grid-column:1/-1}
  .prow.plan .del{order:5}
  .prow.dir,.prow.cosm{grid-template-columns:minmax(0,1fr);padding:10px;border:1px solid var(--border);border-radius:10px}
  .prow.head{display:none}
  .prow .lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  .prow .del{grid-column:1/-1;justify-self:end;font-size:13px;padding:4px 6px}
  .prow .del-t{display:inline}
  .grid3,.mapwrap,.sgrid,.form-grid,.proc-grid{grid-template-columns:minmax(0,1fr)}
  .facemap{max-width:260px;justify-self:center}
  .finish{position:static}
  .kv{grid-template-columns:minmax(0,1fr)}
  .who-am-i{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .visit,.btn,.tpl button,.hist-item{transition:border-color .15s,background-color .15s,box-shadow .15s}
}
/* поля страницы — внутри бумаги, а не у принтера: так браузер не печатает адрес сайта и дату по краям листа */
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff!important;color:#000}
  body > *:not(#print-root){display:none!important}
  #print-root{display:block!important}
  #print-root .paper{border:0;border-radius:0;padding:12mm 13mm;min-width:0;box-shadow:none;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  /* строки бланка растягиваются на лист А4: место под шапку отмерено по печати, с запасом под логотип */
  #print-root .paper.blank.plan tbody td{height:min(12mm,calc(217mm / var(--rows,18)))}
  #print-root .paper.blank.recs tbody td{height:min(12mm,calc(193mm / var(--rows,14)))}
  #print-root .paper .sec,#print-root .paper .sign{break-inside:avoid}
  #print-root .paper.guide{font-size:12px;line-height:1.45;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print-root .paper.guide .g-sec{margin-top:12px}
  #print-root .paper.guide .g-steps{gap:7px}
  #print-root .paper.guide .g-steps ul,#print-root .paper.guide .g-sec > ul{gap:3px}
  #print-root .paper.guide .flow{margin:8px 0 2px}
}

<div id="app"><div class="gate"><div class="card"><p class="muted">Загрузка…</p><noscript><p>Для работы программы нужен включённый JavaScript.</p></noscript></div></div></div>
<div id="overlay" class="overlay" hidden></div>

<script>
/* Kirenix Клиника — рабочая версия для одного специалиста.
   Всё хранится в этом браузере (IndexedDB). Никаких запросов наружу: адрес сайта нужен только чтобы открыть программу.
   С версии 1.3 карты пациентов лежат в IndexedDB зашифрованными: ключ данных (AES-GCM 256) открывается PIN-кодом
   (PBKDF2, 600 000 повторов) или, если PIN забыли, закрытым ключом клиники. После блокировки ключ и данные стираются из памяти.
   Копии шифруются открытым ключом клиники (ECDH P-256 + AES-GCM); закрытый ключ зашифрован паролем клиники (PBKDF2). */
(function(){
'use strict';

const APP = 'kirenix-klinika';
const VERSION = '1.4';
// открытый ключ Kirenix для проверки кодов активации (закрытый — только у Kiren на Mac); подставляет build.py
const LICENSE_PUB = 'MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEDAaEw+t+T4hiv+ouo0REvGa/pMCTHAdhGr5JU7Z4UI9HD5XT7kiIHrXn3S/iQ6xLwpHDMJRQut+0q4E7UN/hFg==';
const DB_NAME = 'kirenix-klinika';
const KEK_ITER = 600000;      // PIN → ключ, которым зашифрован ключ данных
const PW_ITER = 600000;       // пароль клиники → ключ, которым зашифрован закрытый ключ клиники (старые копии: 310 000)
const HARD_FAILS = 10;        // столько неверных PIN подряд — и войти можно только через пароль клиники
const MAX_BACKUP = 200 * 1048576;
const REC_STORES = ['patients', 'visits', 'plans'];
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);

/* ---------- мелочи ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayIso = () => isoOf(new Date());
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const parse = s => { const a = String(s).split('-').map(Number); return new Date(a[0], (a[1] || 1) - 1, a[2] || 1, 12); };
const validIso = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') && !isNaN(parse(s));
const fmtLong = s => validIso(s) ? parse(s).toLocaleDateString('ru-RU', {day: 'numeric', month: 'long', year: 'numeric'}) : '';
const fmtShort = s => validIso(s) ? parse(s).toLocaleDateString('ru-RU', {day: 'numeric', month: 'long'}) : '';

/* ---------- хранилище (IndexedDB) ---------- */
const STORES = ['kv', 'patients', 'visits', 'plans'];
const DB = {
  db: null,
  open(){
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', {keyPath: 'k'});
        ['patients', 'visits', 'plans'].forEach(n => { if (!db.objectStoreNames.contains(n)) db.createObjectStore(n, {keyPath: 'id'}); });
      };
      r.onsuccess = () => { DB.db = r.result; res(DB.db); };
      r.onerror = () => rej(r.error || new Error('indexedDB'));
      r.onblocked = () => rej(new Error('blocked'));
    });
  },
  all(store){
    return new Promise((res, rej) => { const r = DB.db.transaction(store).objectStore(store).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); });
  },
  get(store, key){
    return new Promise((res, rej) => { const r = DB.db.transaction(store).objectStore(store).get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  },
  write(ops){   // ops: [{op:'put'|'del'|'clear', store, value|key}] — одной транзакцией
    const stores = [...new Set(ops.map(o => o.store))];
    return new Promise((res, rej) => {
      const t = DB.db.transaction(stores, 'readwrite');
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error || new Error('write'));
      t.onabort = () => rej(t.error || new Error('abort'));
      ops.forEach(o => { const st = t.objectStore(o.store); if (o.op === 'put') st.put(o.value); else if (o.op === 'del') st.delete(o.key); else st.clear(); });
    });
  }
};

/* после входа: расшифровать карты. Записи старой версии (без шифра) берём как есть и сразу шифруем. */
async function loadRecords(key){
  await saving.catch(() => {});
  const bad = [], plain = [];
  for (const st of REC_STORES){
    const m = new Map();
    await Promise.all((await DB.all(st)).map(async r => {
      if (!r || r.id == null) return;
      if (r.ct){ try { const o = await decRec(key, st, r); m.set(o.id, o); } catch (e){ bad.push(st + ':' + r.id); } }
      else { m.set(r.id, r); plain.push({st, r}); }
    }));
    S[st] = m;
  }
  // правки, которые не успели записаться до блокировки
  pending.forEach(o => { if (o.store === 'kv') return; if (o.op === 'put') S[o.store].set(o.value.id, o.value); else if (o.op === 'del') S[o.store].delete(o.key); });
  if (plain.length){
    const ops = [];
    for (const x of plain) ops.push({op: 'put', store: x.st, value: await encRec(key, x.st, x.r)});
    await DB.write(ops);
  }
  if (bad.length) console.error('не расшифровались', bad);
  return bad.length;
}

/* сохранение: изменения копятся 0,4 с, шифруются и пишутся одной транзакцией */
const pending = new Map();
let saveTimer = 0, saving = Promise.resolve(), inFlight = 0;
function queue(store, value){
  if (store !== 'kv') value.updatedAt = Date.now();
  pending.set(store + ':' + (value.id || value.k), {op: 'put', store, value});
  schedule();
}
function queueDel(store, key){ pending.set(store + ':' + key, {op: 'del', store, key}); schedule(); }
function saveSettings(){ queue('kv', {k: 'settings', v: S.settings}); }
function schedule(){ setSaveState('pending'); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 400); }
function flush(){
  clearTimeout(saveTimer);
  if (!pending.size) return saving;
  const key = S.dk, ops = [];
  // карты без ключа не пишем: они дождутся входа (так бывает, только если запись сорвалась перед блокировкой)
  pending.forEach((o, k) => { if (o.store === 'kv' || key){ ops.push(o); pending.delete(k); } });
  if (!ops.length) return saving;
  inFlight++;
  saving = saving.then(() => sealOps(ops, key)).then(sealed => DB.write(sealed)).then(() => { inFlight--; if (!pending.size && !inFlight) setSaveState('ok'); },
    err => { inFlight--; console.error(err); ops.forEach(o => { const k = o.store + ':' + (o.op === 'put' ? (o.value.id || o.value.k) : o.key); if (!pending.has(k)) pending.set(k, o); }); setSaveState('err'); });
  return saving;
}
function sealOps(ops, key){
  return Promise.all(ops.map(async o => (o.op === 'put' && o.store !== 'kv') ? {op: 'put', store: o.store, value: await encRec(key, o.store, o.value)} : o));
}
function setSaveState(s){
  const was = S.saveState; S.saveState = s;
  const el = document.getElementById('save-state');
  if (el){ el.className = 'save-state ' + s; el.innerHTML = s === 'ok' ? '<span class="dot"></span>Сохранено' : s === 'pending' ? 'Сохраняю…' : '<span class="dot"></span>Не сохранено'; }

}

/* ---------- шифрование ---------- */
const safeIter = n => Math.min(2000000, Math.max(100000, Math.round(+n) || 0));   // число повторов из файла не даём раздуть
async function pbkdf2(pass, salt, iter){
  const key = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt, iterations: safeIter(iter)}, key, 256);
}
async function pinHash(pin, saltB64, iter){ return b64(await pbkdf2(pin, unb64(saltB64), iter)); }   // только для данных версии 1.2
async function pwKey(pw, salt, iter){ return crypto.subtle.importKey('raw', await pbkdf2(pw, salt, iter), 'AES-GCM', false, ['encrypt', 'decrypt']); }
async function wrapPkcs8(pw, pkcs8){
  const salt = rnd(16), iv = rnd(12);
  const data = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, await pwKey(pw, salt, PW_ITER), pkcs8);
  return {salt: b64(salt), iv: b64(iv), iter: PW_ITER, data: b64(data)};
}
async function unwrapPkcs8(pw, w){   // неверный пароль — исключение
  return crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(w.iv)}, await pwKey(pw, unb64(w.salt), w.iter), unb64(w.data));
}
/* ключ данных: 32 случайных байта; хранится зашифрованным PIN-кодом (dkPin) и открытым ключом клиники (dkBox) */
async function wrapDk(pin, raw){
  const salt = rnd(16), iv = rnd(12);
  const data = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, await pwKey(pin, salt, KEK_ITER), raw);
  return {salt: b64(salt), iv: b64(iv), iter: KEK_ITER, data: b64(data)};
}
async function unwrapDk(pin, w){   // неверный PIN — исключение OperationError
  return new Uint8Array(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(w.iv)}, await pwKey(pin, unb64(w.salt), w.iter), unb64(w.data)));
}
const importDk = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
async function encRec(key, store, obj){
  const iv = rnd(12);
  const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv, additionalData: enc.encode(store + ':' + obj.id)}, key, enc.encode(JSON.stringify(obj)));
  return {id: obj.id, iv: b64(iv), ct: b64(ct)};
}
async function decRec(key, store, r){
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(r.iv), additionalData: enc.encode(store + ':' + r.id)}, key, unb64(r.ct));
  const o = JSON.parse(dec.decode(pt));
  if (!o || o.id !== r.id) throw new Error('запись не совпала');
  return o;
}
const privFrom = pkcs8 => crypto.subtle.importKey('pkcs8', pkcs8, {name: 'ECDH', namedCurve: 'P-256'}, false, ['deriveKey', 'deriveBits']);

/* ---------- активация: один код — один компьютер ----------
   Номер компьютера — 8 случайных знаков, хранится в этом браузере. Код выдаёт Kirenix: в нём номер компьютера и срок
   «оплачено до» (или без срока), подписанные закрытым ключом Kirenix (ECDSA P-256). Программа проверяет подпись открытым
   ключом — интернет не нужен. После срока карты можно смотреть и печатать, а новые приёмы — только после нового кода. */
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function b32enc(bytes){
  let bits = 0, val = 0, out = '';
  for (const b of bytes){ val = ((val << 8) | b) & 0xFFFF; bits += 8; while (bits >= 5){ out += B32[(val >>> (bits - 5)) & 31]; bits -= 5; } }
  if (bits > 0) out += B32[(val << (5 - bits)) & 31];
  return out;
}
function b32dec(str){
  const s = String(str || '').toUpperCase().replace(/[\s\-–—_.]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1');
  let bits = 0, val = 0; const out = [];
  for (const ch of s){ const i = B32.indexOf(ch); if (i < 0) return null; val = ((val << 5) | i) & 0xFFFF; bits += 5; if (bits >= 8){ out.push((val >>> (bits - 8)) & 255); bits -= 8; } }
  return new Uint8Array(out);
}
const devFmt = id => id ? id.slice(0, 4) + '-' + id.slice(4) : '';
const LIC_EPOCH = Date.UTC(2026, 0, 1);
let licKeyP = null;
const licKey = () => licKeyP || (licKeyP = crypto.subtle.importKey('spki', unb64(LICENSE_PUB), {name: 'ECDSA', namedCurve: 'P-256'}, false, ['verify']));
/* код: 1 байт версии, 5 байт номера компьютера, 2 байта срока (дни с 01.01.2026, 0 — без срока), 1 запасной, 64 байта подписи */
async function readCode(code){
  const b = b32dec(code);
  if (!b || b.length !== 73 || b[0] !== 1) return null;
  const payload = b.slice(0, 9);
  let ok = false;
  try { ok = await crypto.subtle.verify({name: 'ECDSA', hash: 'SHA-256'}, await licKey(), b.slice(9), payload); } catch (e){ ok = false; }
  if (!ok) return null;
  const days = (payload[6] << 8) | payload[7];
  return {device: b32enc(payload.slice(1, 6)), until: days ? new Date(LIC_EPOCH + days * 86400000).toISOString().slice(0, 10) : ''};
}
function licDates(L){
  L.expired = !!L.until && L.until < todayIso();
  L.daysLeft = L.until ? Math.round((parse(L.until) - parse(todayIso())) / 86400000) : null;
  L.soon = !L.expired && L.daysLeft !== null && L.daysLeft <= 7;
}
/* при запуске: номер компьютера (создаётся один раз) и сохранённый код */
async function loadLicense(){
  const L = S.lic;
  let dev = await DB.get('kv', 'device');
  if (!dev || !/^[0-9A-HJKMNP-TV-Z]{8}$/.test(dev.id)){
    dev = {k: 'device', id: b32enc(rnd(5)), createdAt: Date.now()};
    await DB.write([{op: 'put', store: 'kv', value: dev}]);
  }
  L.device = dev.id;
  const rec = await DB.get('kv', 'license');
  const got = rec && rec.code ? await readCode(rec.code) : null;
  L.ok = !!got && got.device === L.device;
  L.code = L.ok ? rec.code : ''; L.until = L.ok ? got.until : ''; L.at = L.ok ? rec.at || 0 : 0;
  licDates(L);
}
async function activate(code){
  const L = S.lic; L.err = '';
  let got = await readCode(code);
  if (!got){   // вставили всё сообщение целиком — найдём в нём сам код
    for (const t of String(code).match(/[0-9A-Za-z]{100,}/g) || []){ got = await readCode(t); if (got){ code = t; break; } }
  }
  if (!got){ L.err = 'Код не подходит. Скопируйте его из сообщения целиком.'; return false; }
  if (got.device !== L.device){ L.err = 'Этот код выдан для другого компьютера (номер в коде ' + devFmt(got.device) + '). Номер этого компьютера — ' + devFmt(L.device) + ': попросите код для него.'; return false; }
  if (got.until && got.until < todayIso()){ L.err = 'Срок этого кода закончился ' + fmtDot(got.until) + '. Попросите новый код.'; return false; }
  const rec = {k: 'license', code: b32enc(b32dec(code)), device: L.device, until: got.until, at: Date.now()};
  await DB.write([{op: 'put', store: 'kv', value: rec}]);
  Object.assign(L, {ok: true, code: rec.code, until: got.until, at: rec.at, mode: ''});
  licDates(L);
  return true;
}
/* номер компьютера и код переживают «Удалить все данные» и восстановление из копии: они про компьютер, а не про карты */
function keepLicenseOps(){
  const L = S.lic, ops = [{op: 'put', store: 'kv', value: {k: 'device', id: L.device, createdAt: Date.now()}}];
  if (L.ok) ops.push({op: 'put', store: 'kv', value: {k: 'license', code: L.code, device: L.device, until: L.until, at: L.at}});
  return ops;
}
function licBlocked(){
  if (!S.lic.expired) return false;
  toast('Срок кода активации закончился ' + fmtDot(S.lic.until) + '. Новые приёмы — после нового кода; карты можно смотреть и печатать.', 7000);
  return true;
}
async function makeClinicKeys(pw){
  const kp = await crypto.subtle.generateKey({name: 'ECDH', namedCurve: 'P-256'}, true, ['deriveKey', 'deriveBits']);
  const pub = await crypto.subtle.exportKey('jwk', kp.publicKey);
  const pkcs8 = await crypto.subtle.exportKey('pkcs8', kp.privateKey);
  return {pub, wrap: await wrapPkcs8(pw, pkcs8)};
}
async function openClinicKey(pw, w){
  const pkcs8 = await unwrapPkcs8(pw, w);
  return crypto.subtle.importKey('pkcs8', pkcs8, {name: 'ECDH', namedCurve: 'P-256'}, false, ['deriveKey', 'deriveBits']);
}
async function sealFor(pubJwk, bytes){
  const pub = await crypto.subtle.importKey('jwk', pubJwk, {name: 'ECDH', namedCurve: 'P-256'}, false, []);
  const eph = await crypto.subtle.generateKey({name: 'ECDH', namedCurve: 'P-256'}, true, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'ECDH', public: pub}, eph.privateKey, {name: 'AES-GCM', length: 256}, false, ['encrypt']);
  const iv = rnd(12);
  const data = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, bytes);
  return {epk: await crypto.subtle.exportKey('jwk', eph.publicKey), iv: b64(iv), data: b64(data)};
}
async function openSealed(priv, box){
  const epk = await crypto.subtle.importKey('jwk', box.epk, {name: 'ECDH', namedCurve: 'P-256'}, false, []);
  const key = await crypto.subtle.deriveKey({name: 'ECDH', public: epk}, priv, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  return crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(box.iv)}, key, unb64(box.data));
}
/* правила для нового PIN и пароля клиники; старые (короче) продолжают работать, пока их не сменят */
const COMMON_PINS = ['123456', '654321', '123321', '159753', '147258', '258369', '147852', '789456', '102030', '696969', '112211', '123654', '12345678', '87654321', '19701970'];
function weakPin(p){
  return /^(\d{1,4})\1+$/.test(p) || /^(?:(\d)\1)+$/.test(p) || '01234567890123456789'.indexOf(p) >= 0 || '98765432109876543210'.indexOf(p) >= 0 || COMMON_PINS.indexOf(p) >= 0;
}
function newPinError(a, b){
  if (!/^\d{6,8}$/.test(a)) return 'PIN — от 6 до 8 цифр.';
  if (weakPin(a)) return 'Слишком простой PIN. Придумайте другой.';
  if (a !== b) return 'PIN не совпадает.';
  return '';
}
const COMMON_PW = ['password', 'qwerty', 'qwertyuiop', 'asdfgh', 'asdfghjkl', 'zxcvbn', 'qazwsx', 'qazwsxedc', 'admin', 'administrator', 'parol', 'пароль', 'йцукен', 'йцукенгшщз', 'клиника', 'klinika', 'kirenix', 'iloveyou', 'letmein', 'welcome', 'privet', 'привет'];
function newPwError(a, b){
  if (a.length < 10) return 'Пароль клиники — не короче 10 знаков.';
  if (!/[A-Za-zА-Яа-яЁё]/.test(a)) return 'В пароле клиники нужны буквы, а не только цифры.';
  const letters = a.toLowerCase().replace(/[^a-zа-яё]/g, '');
  if (letters.length < 3 || /^(.)\1*$/.test(letters) || COMMON_PW.indexOf(letters) >= 0) return 'Слишком простой пароль. Придумайте другой — например, три слова через дефис.';
  if (a !== b) return 'Пароли не совпадают.';
  return '';
}

/* новый компьютер: ключ данных, ключи клиники, всё зашифровано */
async function newSecurity(pin, pw){
  const raw = rnd(32), keys = await makeClinicKeys(pw);
  const sec = {v: 2, pub: keys.pub, wrap: keys.wrap, dkPin: await wrapDk(pin, raw), dkBox: await sealFor(keys.pub, raw)};
  const key = await importDk(raw); raw.fill(0);
  return {sec, key};
}
/* PIN → ключ данных; null — неверный PIN. Данные версии 1.2 при первом входе шифруются. */
async function keyFromPin(pin){
  const sec = S.settings.security;
  if (sec.dkPin){
    let raw;
    try { raw = await unwrapDk(pin, sec.dkPin); } catch (e){ if (e && e.name === 'OperationError') return null; throw e; }
    const key = await importDk(raw); raw.fill(0);
    return key;
  }
  if (sec.pinHash && sec.pinSalt){
    if ((await pinHash(pin, sec.pinSalt, sec.pinIter)) !== sec.pinHash) return null;
    return encryptOldData(pin);
  }
  throw new Error('нет ключей программы');
}
/* переход с версии 1.2: новый ключ данных, все карты шифруются одной транзакцией вместе с настройками */
async function encryptOldData(pin){
  const sec = S.settings.security, raw = rnd(32);
  const key = await importDk(raw);
  const next = Object.assign({}, sec, {v: 2, dkPin: await wrapDk(pin, raw), dkBox: await sealFor(sec.pub, raw), shortPin: pin.length < 6});
  raw.fill(0);
  delete next.pinHash; delete next.pinSalt; delete next.pinIter;
  await saving.catch(() => {});
  const ops = [];
  for (const st of REC_STORES){
    for (const r of await DB.all(st)) if (r && r.id != null && !r.ct) ops.push({op: 'put', store: st, value: await encRec(key, st, r)});
  }
  ops.push({op: 'put', store: 'kv', value: {k: 'settings', v: Object.assign({}, S.settings, {security: next})}});
  await DB.write(ops);
  S.settings.security = next;
  return key;
}
/* «Забыли PIN?»: пароль клиники открывает ключ данных, новый PIN его перешифровывает */
async function resetPin(pw, pkcs8, pin){
  const sec = S.settings.security;
  if (!sec.dkBox) return encryptOldData(pin);
  const raw = new Uint8Array(await openSealed(await privFrom(pkcs8), sec.dkBox));
  const next = Object.assign({}, sec, {dkPin: await wrapDk(pin, raw), shortPin: false});
  if (safeIter(sec.wrap.iter) < PW_ITER) next.wrap = await wrapPkcs8(pw, pkcs8);
  const key = await importDk(raw); raw.fill(0);
  S.settings.security = next; saveSettings(); await flush();
  return key;
}
/* общий вход после PIN или пароля клиники */
async function openWith(key){
  lockGen++;
  S.dk = key;
  const bad = await loadRecords(key);
  S.lock.fails = 0; S.lock.until = 0; await saveLock();
  S.lock = {mode: 'pin', err: '', busy: false, fails: 0, until: 0};
  S.locked = false; lastAct = Date.now();
  renderDatalists(); render();
  if (bad) toast('Не удалось прочитать записей: ' + bad + '. Ничего не удаляйте и напишите в поддержку: Telegram @aikiren.', 12000);
  autoBackup();

/* ---------- копии ---------- */
function download(name, text){
  const url = URL.createObjectURL(new Blob([text], {type: 'application/json'}));
  const a = document.createElement('a'); a.href = url; a.download = name; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
}
async function makeBackup(auto){

  const createdAt = new Date().toISOString(), day = todayIso();
  const stCopy = clone(st); stCopy.backup.lastAt = createdAt; stCopy.backup.lastDay = day;
  const payload = {app: APP, v: 1, createdAt, appVersion: VERSION, settings: stCopy, patients: [...S.patients.values()], visits: [...S.visits.values()], plans: [...S.plans.values()]};
  const box = await sealFor(st.security.pub, enc.encode(JSON.stringify(payload)));
  const file = {app: APP, kind: 'backup', v: 1, createdAt, clinic: st.clinic.name,
    counts: {patients: payload.patients.length, visits: payload.visits.length, plans: payload.plans.length},

  const name = 'kirenix-klinika-kopiya-' + day + '-' + nowHM().replace(':', '') + pad(new Date().getSeconds()) + '.json';
  download(name, JSON.stringify(file));

  toast((auto ? 'Копия за сегодня сохранена' : 'Копия сохранена') + ' в папку «Загрузки»: ' + name, 6500);

}
async function autoBackup(){
  const b = S.settings.backup;
  if (!b.auto || !(S.patients.size || S.visits.size) || b.lastDay === todayIso()) return;
  try { await makeBackup(true); } catch (e){ console.error(e); toast('Не удалось сохранить копию за сегодня. Сохраните её вручную в настройках.', 7000); }
}
const userErr = m => Object.assign(new Error(m), {user: true});
async function readBackup(file, pw){
  if (file.size > MAX_BACKUP) throw userErr('Файл слишком большой — это не копия Kirenix Клиники.');
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (e){ throw userErr('Файл повреждён или это не копия Kirenix Клиники.'); }
  if (!obj || obj.app !== APP || obj.kind !== 'backup' || !obj.wrap || !obj.box) throw userErr('Это не файл копии Kirenix Клиники.');
  let priv;
  try { priv = await openClinicKey(pw, obj.wrap); } catch (e){ throw userErr('Неверный пароль клиники для этой копии.'); }
  let data;
  try { data = JSON.parse(dec.decode(await openSealed(priv, obj.box))); } catch (e){ throw userErr('Копия повреждена — открыть её не получилось.'); }
  if (!data || data.app !== APP || !data.settings || !Array.isArray(data.patients) || !Array.isArray(data.visits) || !Array.isArray(data.plans)) throw userErr('В копии нет нужных данных.');

/* Копию проверяем по полям, прежде чем положить в программу: в разметку попадает только то, что должно там быть. */
const ID_RE = /^[\w-]{1,64}$/;

    procId: str(v.procId), procName: str(v.procName), unit: str(v.unit), step: num(v.step) || 1, def: num(v.def), doctor: str(v.doctor),
    diag: str(v.diag), dx: str(v.dx), drug: str(v.drug), batch: str(v.batch), expiry: str(v.expiry), memo: str(v.memo), consent: !!v.consent,
    flags: Object.assign({drug: false, inject: false, consent: false, memo: false}, v.flags),
    checklist: Array.isArray(v.checklist) ? v.checklist.map(str) : [], checked: Array.isArray(v.checked) ? v.checked.map(Boolean) : [],
    points: Array.isArray(v.points) ? v.points.map(q => ({x: Math.max(0, Math.min(200, num(q && q.x))), y: Math.max(0, Math.min(240, num(q && q.y))), u: str(q && q.u)})) : [],
    copiedFrom: validIso(v.copiedFrom) ? v.copiedFrom : null, log: Array.isArray(v.log) ? v.log.filter(l => l && typeof l.what === 'string') : []}));

    type: [0, 1, 2].indexOf(+p.type) >= 0 ? +p.type : 0, from: validIso(p.from) ? p.from : '', createdAt: num(p.createdAt),
    rows: (Array.isArray(p.rows) ? p.rows : []).map(r => ({date: validIso(r && r.date) ? r.date : '', svc: str(r && r.svc), dose: str(r && r.dose), zone: str(r && r.zone)})),

    cosm: (Array.isArray(p.cosm) ? p.cosm : []).map(r => ({name: str(r && r.name), rule: str(r && r.rule)}))}));

}
/* восстановление: карты кладутся зашифрованными ключом данных из копии; копия версии 1.2 — как есть, зашифруется при первом входе */
async function replaceAll(data, priv){
  let key = null;
  if (data.settings.security.dkBox){
    let raw;
    try { raw = new Uint8Array(await openSealed(priv, data.settings.security.dkBox)); } catch (e){ throw userErr('Копия повреждена — открыть её не получилось.'); }
    key = await importDk(raw); raw.fill(0);
  }
  const ops = STORES.map(s => ({op: 'clear', store: s})).concat(keepLicenseOps());
  ops.push({op: 'put', store: 'kv', value: {k: 'settings', v: data.settings}});
  for (const st of REC_STORES) for (const x of data[st]) ops.push({op: 'put', store: st, value: key ? await encRec(key, st, x) : x});
  pending.clear();
  await saving.catch(() => {});
  await DB.write(ops);
  S.locked = true; forgetData();
  S.lock = {mode: 'pin', err: '', busy: false, fails: 0, until: 0};
  await loadSettings();
}
async function doRestore(where){
  const R = S.restore, pwEl = $('#rs-pw'), pw = pwEl ? pwEl.value : '';
  if (!R.file){ R.err = 'Выберите файл копии.'; return render(); }
  if (!pw){ R.err = 'Введите пароль клиники.'; return render(); }
  R.busy = true; R.err = ''; render();
  try {
    const got = await readBackup(R.file, pw), data = got.data;
    const has = S.patients.size || S.visits.size;
    const ok = confirm('Восстановить копию от ' + fmtDT(data.createdAt) + '?\n\nВ копии пациентов: ' + data.patients.length + ', визитов: ' + data.visits.length + '.' +
      (has ? '\n\nВсе данные на этом компьютере заменятся данными из копии. Перед этим программа сохранит копию текущих данных в «Загрузки».' : ''));
    if (!ok){ R.busy = false; return render(); }
    if (has && S.settings && S.dk) await makeBackup(false);
    await replaceAll(data, got.priv);
    S.restore = {file: null, err: '', busy: false};
    S.setup = freshSetup();
    S.ui = freshUi();
    render(); toast('Копия восстановлена. Введите PIN специалиста — тот, что был в копии.', 7000);
  } catch (e){
    if (!e.user) console.error(e); R.busy = false; R.err = e.message || 'Не удалось восстановить копию.'; render();
  }
}

function findPatients(q){
  q = clean(q);
  const all = [...S.patients.values()].sort((a, b) => fio(a).localeCompare(fio(b), 'ru'));
  if (!q) return all;
  if (/\d/.test(q)) return all.filter(p => norm(p.card).indexOf(norm(q)) >= 0);
  const parts = norm(q).split(' ');
  return all.filter(p => norm(p.last).startsWith(parts[0]) && (!parts[1] || norm(p.first).startsWith(parts[1])) && (!parts[2] || norm(p.middle).startsWith(parts[2])));

  const old = all.filter(v => v.status !== 'done' && v.date < t).sort(byTime).reverse();
  const done = all.filter(v => v.status === 'done' && v.date === t).sort(byTime);
  const day = new Date().toLocaleDateString('ru-RU', {weekday: 'long', day: 'numeric', month: 'long'});
  let out = '<div class="page-head"><div><h1>Сегодня</h1><p>' + esc(cap(day)) + '</p></div><button type="button" class="btn btn-primary btn-lg" data-act="start-new">+ Начать приём</button></div>';
  if (!going.length && !old.length && !done.length){

  return out;
}

/* периоды для журнала и отчётов */
const PERIODS = [['', 'за всё время'], ['today', 'сегодня'], ['week', 'последние 7 дней'], ['month', 'этот месяц'], ['prev', 'прошлый месяц'], ['year', 'этот год']];
function periodFrom(k){
  const d = new Date();
  if (k === 'today') return todayIso();
  if (k === 'week'){ d.setDate(d.getDate() - 6); return isoOf(d); }
  if (k === 'month') return isoOf(new Date(d.getFullYear(), d.getMonth(), 1));
  if (k === 'prev') return isoOf(new Date(d.getFullYear(), d.getMonth() - 1, 1));
  if (k === 'year') return isoOf(new Date(d.getFullYear(), 0, 1));
  return '';
}
function periodTo(k){ const d = new Date(); return k === 'prev' ? isoOf(new Date(d.getFullYear(), d.getMonth(), 0)) : ''; }
function inPeriod(v, k){ const a = periodFrom(k), b = periodTo(k); return (!a || v.date >= a) && (!b || v.date <= b); }

/* срок годности «ММ.ГГГГ» → последний день месяца; null, если не разобрать */
function expiryEnd(s){
  const m = String(s || '').match(/(\d{1,2})\s*[.\/-]\s*(\d{2,4})/);
  if (!m) return null;
  let mo = +m[1], y = +m[2]; if (y < 100) y += 2000;
  if (mo < 1 || mo > 12) return null;
  return isoOf(new Date(y, mo, 0));
}

/* «Препараты»: какие серии вводились и кому — на случай отзыва серии */
function batchKey(v){ return norm(v.drug) + '|' + norm(v.batch); }
function drugBatches(){
  const map = new Map();
  [...S.visits.values()].filter(v => v.status === 'done' && v.flags.drug && clean(v.drug)).forEach(v => {
    const k = batchKey(v);
    if (!map.has(k)) map.set(k, {drug: clean(v.drug), batch: clean(v.batch), expiry: clean(v.expiry), visits: []});
    const b = map.get(k); b.visits.push(v); if (!b.expiry && v.expiry) b.expiry = clean(v.expiry);
  });
  return [...map.values()].map(b => { b.visits.sort(byTime).reverse(); b.last = b.visits[0].date; b.patients = new Set(b.visits.map(v => v.pid)).size; b.units = b.visits.reduce((s, v) => s + (v.flags.inject ? total(v) : 0), 0); b.unit = (b.visits.find(v => v.unit) || {}).unit || ''; return b; })
    .sort((a, b) => a.drug.localeCompare(b.drug, 'ru') || b.last.localeCompare(a.last));
}
function renderDrugs(){
  return '<div class="page-head"><div><h1>Препараты и серии</h1><p>Какие препараты и серии вводились и кому. Если производитель отзовёт серию, здесь сразу видно всех пациентов с ней.</p></div></div>' +
    '<div class="card stack"><label class="field"><span>Поиск: название препарата или серия</span><input type="search" id="dq" data-f="dq" value="' + esc(S.ui.dq) + '" placeholder="Например, C1234" autocomplete="off"></label>' +
    '<div id="drug-list">' + drugListHtml() + '</div></div>';
}
function drugListHtml(){
  const q = norm(S.ui.dq), t = todayIso();
  const list = drugBatches().filter(b => !q || norm(b.drug).indexOf(q) >= 0 || norm(b.batch).indexOf(q) >= 0);
  if (!list.length) return '<p class="note">' + (q ? 'Ничего не нашли.' : 'Пока пусто. Препараты и серии появятся здесь после первых завершённых приёмов.') + '</p>';
  let out = '', cur = '';
  list.forEach(b => {
    if (b.drug !== cur){ out += (cur ? '</div>' : '') + '<h3 class="jday">' + esc(b.drug) + '</h3><div class="vlist">'; cur = b.drug; }
    const end = expiryEnd(b.expiry), late = b.visits.some(v => end && v.date > end);
    out += '<button type="button" class="vrow batch" data-act="open-batch" data-drug="' + esc(b.drug) + '" data-batch="' + esc(b.batch) + '"><span class="vr-t">' + (b.batch ? 'серия' : '') + '<small class="mono">' + (b.batch ? esc(b.batch) : 'без серии') + '</small></span>' +
      '<span class="vr-main"><b>' + b.visits.length + ' ' + plural(b.visits.length, 'приём', 'приёма', 'приёмов') + ' · ' + b.patients + ' ' + plural(b.patients, 'пациент', 'пациента', 'пациентов') + '</b>' +
      '<span class="small muted">годен до ' + (b.expiry ? esc(b.expiry) : '—') + ' · последний раз ' + fmtShort(b.last) + (b.units ? ' · введено ' + fmtNum(b.units) + ' ' + esc(b.unit) : '') + '</span></span>' +
      '<span class="vr-st">' + (late ? '<span class="chip bad">вводили после срока годности</span>' : end && end < t ? '<span class="chip neutral">срок годности истёк</span>' : '') + '</span></button>';
  });
  return out + '</div>';
}
function renderBatch(){
  const b = drugBatches().find(x => norm(x.drug) === norm(S.ui.batch.drug) && norm(x.batch) === norm(S.ui.batch.batch));
  if (!b){ S.ui.batch = null; return renderDrugs(); }
  const end = expiryEnd(b.expiry);
  return crumbs([secCrumb(), [esc(b.drug) + (b.batch ? ', серия ' + esc(b.batch) : '')]]) +
    '<div class="page-head"><div><h1>' + esc(b.drug) + '</h1><p>Серия <b class="mono">' + (b.batch ? esc(b.batch) : 'не указана') + '</b> · годен до ' + (b.expiry ? esc(b.expiry) : '—') + ' · ' + b.visits.length + ' ' + plural(b.visits.length, 'приём', 'приёма', 'приёмов') + ', ' + b.patients + ' ' + plural(b.patients, 'пациент', 'пациента', 'пациентов') + '</p></div></div>' +
    '<div class="card stack"><p class="small">Все приёмы с этой серией, новые сверху. Нажмите на приём, чтобы открыть запись.</p><div class="vlist">' +
      b.visits.map(v => visitRow(v, true) + (end && v.date > end ? '<p class="err-text" style="margin:-2px 0 4px 6px">Введён после окончания срока годности.</p>' : '')).join('') + '</div></div>';
}
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };

/* «Отчёты»: сколько приёмов, пациентов, процедур и препарата за период */
function reportData(k){
  const vs = [...S.visits.values()].filter(v => v.status === 'done' && inPeriod(v, k));
  const by = (key, fn) => { const m = new Map(); vs.forEach(v => { const kk = key(v); if (!kk) return; const r = m.get(kk) || {name: kk, n: 0, units: new Map(), pids: new Set()}; r.n++; r.pids.add(v.pid); if (v.flags.inject && v.unit) r.units.set(v.unit, (r.units.get(v.unit) || 0) + total(v)); m.set(kk, r); }); return [...m.values()].sort((a, b) => b.n - a.n || a.name.localeCompare(b.name, 'ru')); };
  return {vs, procs: by(v => v.procName), drugs: by(v => v.flags.drug ? clean(v.drug) : ''), pids: new Set(vs.map(v => v.pid)), first: vs.filter(v => v.kind === 'первичный').length};
}
function reportHtml(k){
  const d = reportData(k), lbl = (PERIODS.find(x => x[0] === k) || PERIODS[0])[1];
  const units = r => [...r.units.entries()].map(e => fmtNum(e[1]) + ' ' + esc(e[0])).join(', ') || '—';
  const table = (title, rows, col) => '<h3 class="rep-h">' + title + '</h3>' + (rows.length ? '<table class="rep"><thead><tr><th>' + col + '</th><th>Приёмов</th><th>Пациентов</th><th>Введено</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td>' + esc(r.name) + '</td><td>' + r.n + '</td><td>' + r.pids.size + '</td><td>' + units(r) + '</td></tr>').join('') + '</tbody></table>' : '<p class="note">Нет данных за этот период.</p>');
  return '<p class="small muted">Период: ' + lbl + (periodFrom(k) ? ' (с ' + fmtDot(periodFrom(k)) + (periodTo(k) ? ' по ' + fmtDot(periodTo(k)) : '') + ')' : '') + ' · только завершённые приёмы</p>' +
    '<div class="kpis"><div><b>' + d.vs.length + '</b><span>приёмов</span></div><div><b>' + d.pids.size + '</b><span>пациентов</span></div><div><b>' + d.first + '</b><span>первичных</span></div><div><b>' + (d.vs.length - d.first) + '</b><span>повторных</span></div></div>' +
    table('По процедурам', d.procs, 'Процедура') + table('По препаратам', d.drugs, 'Препарат');
}
function renderReports(){
  return '<div class="page-head"><div><h1>Отчёты</h1><p>Сколько приёмов и пациентов за период, какие процедуры и сколько препарата введено.</p></div>' +

function journalListHtml(){
  const q = norm(S.ui.jq), pr = S.ui.jproc;

  list.sort(byTime).reverse();
  if (!list.length) return '<p class="note">' + ([...S.visits.values()].some(v => v.status === 'done') ? 'Ничего не нашли. Измените фамилию или процедуру.' : 'Проведённых приёмов пока нет. Они появятся здесь после «Завершить визит».') + '</p>';

}

/* Safari стирает данные сайта, если его не открывать 7 дней, — для карт пациентов это недопустимо */
const IS_SAFARI = navigator.vendor === 'Apple Computer, Inc.' && !/CriOS|FxiOS|EdgiOS|YaBrowser/.test(navigator.userAgent);
const SAFARI_WARN = '<div class="banner bad" role="alert"><span><b>Откройте программу в Google Chrome.</b> Safari стирает данные сайта, если его не открывать 7 дней, — карты пациентов могут пропасть.</span></div>';
function banners(){
  let out = IS_SAFARI ? SAFARI_WARN : '';
  const L = S.lic;
  if (L.expired) out += '<div class="banner bad" role="alert"><span><b>Срок кода активации закончился ' + fmtDot(L.until) + '.</b> Карты можно смотреть и печатать, новые приёмы — после нового кода. Напишите нам: Telegram @aikiren.</span><button type="button" class="btn small" data-act="lic-renew">Ввести новый код</button></div>';
  else if (L.soon) out += '<div class="banner"><span><b>Код активации действует до ' + fmtDot(L.until) + '.</b> Чтобы работать дальше, попросите у нас новый код.</span><button type="button" class="btn small" data-act="lic-renew">Ввести новый код</button></div>';
  if (S.settings.security.shortPin && !(S.ui.view === 'settings' && S.ui.stab === 'security')) out += '<div class="banner"><span><b>PIN короче 6 цифр.</b> Такой проще подобрать — смените его на 6–8 цифр.</span><button type="button" class="btn small" data-act="goto-settings" data-tab="security">Сменить PIN</button></div>';
  if (!clean(S.settings.clinic.legal) && S.ui.view !== 'settings') out += '<div class="banner info"><span><b>Для согласий впишите полное название и адрес клиники.</b> Пока их нет, на согласиях будет пустая строка.</span><button type="button" class="btn small" data-act="goto-docs">Вписать</button></div>';
  if (S.saveState === 'err') out += '<div class="banner bad" role="alert"><span><b>Изменения не сохранились.</b> Возможно, на компьютере закончилось место. Не закрывайте программу.</span><button type="button" class="btn small" data-act="retry-save">Сохранить ещё раз</button></div>';
  const b = S.settings.backup;
  if (S.patients.size){
    const d = b.lastAt ? daysSince(b.lastAt) : null;
    if (d === null || d >= 3) out += '<div class="banner"><span><b>' + (d === null ? 'Копия данных ещё не сохранялась.' : 'Копия данных не сохранялась ' + d + ' дн.') + '</b> Она спасёт карты, если с браузером или компьютером что-то случится.</span><button type="button" class="btn small" data-act="backup">Сохранить копию</button></div>';
  }
  return out;
}

/* пациент: новый и изменение */
function renderPatientForm(){
  const isNew = S.ui.edit === 'new';
  const p = isNew ? {sex: 'ж'} : (pat(S.ui.edit) || {});
  const txt = (id, val, extra) => '<input type="text" id="' + id + '" value="' + esc(val || '') + '" autocomplete="off"' + (extra || '') + '>';
  const area = (id, val) => '<textarea id="' + id + '" rows="2" style="min-height:58px">' + esc(val || '') + '</textarea>';
  const canDel = !isNew && !visitsOf(p.id).some(v => v.status === 'done' || (v.log || []).some(l => /Завершён/.test(l.what)));
  const trail = isNew ? (S.ui.start ? [secCrumb(), ['Начать приём', 'data-act="pf-cancel"'], ['Новый пациент']] : [secCrumb(), ['Новый пациент']])
    : [secCrumb(), [esc(fio(p)), 'data-act="pf-cancel"'], ['Изменить данные']];
  return crumbs(trail) + '<div class="stack"><div class="card stack" id="pform"><h2>' + (isNew ? 'Новый пациент' : 'Изменить данные пациента') + '</h2>' +
    '<div class="lock">' + ICON_LOCK + '<span>Только медицинская часть. Телефон, паспорт и адрес сюда не вносятся — они остаются в системе записи клиники.</span></div>' +
    '<div class="form-grid">' +
      field('Фамилия', txt('pf-last', p.last, ' data-autofocus'), true) +
      field('Имя', txt('pf-first', p.first), true) +
      field('Отчество', txt('pf-middle', p.middle)) +
      field('Дата рождения', '<input type="date" id="pf-birth" value="' + esc(p.birth || '') + '" min="1900-01-01" max="' + todayIso() + '">', true) +
      field('Пол', '<select id="pf-sex"><option value="ж"' + (p.sex !== 'м' ? ' selected' : '') + '>женский</option><option value="м"' + (p.sex === 'м' ? ' selected' : '') + '>мужской</option></select>') +
      field('№ медицинской карты', txt('pf-card', p.card, ' placeholder="номер бумажной карты, если есть"')) +
      '<label class="checkline span3"><input type="checkbox" id="pf-before"' + (p.wasBefore ? ' checked' : '') + '><span>Пациент уже бывал в клинике до этой программы — тогда приём считается повторным</span></label>' +
      field('Аллергия', area('pf-allergy', p.allergy), false, 'span3') +
      field('Хронические заболевания', area('pf-chronic', p.chronic), false, 'span3') +
      field('Принимает препараты', area('pf-meds', p.meds), false, 'span3') +
      field('Заметки', area('pf-note', p.note), false, 'span3') +
    '</div>' + errBox(S.ui.formErr) +
    '<div class="row end">' + (canDel ? '<button type="button" class="btn btn-ghost btn-danger" data-act="pf-delete" style="margin-right:auto">Удалить пациента</button>' : '') +
      '<button type="button" class="btn" data-act="pf-cancel">Отмена</button><button type="button" class="btn btn-primary" data-act="pf-save">' + (isNew ? 'Добавить пациента' : 'Сохранить') + '</button></div></div></div>';
}
function savePatientForm(){
  const isNew = S.ui.edit === 'new';
  const val = id => ($('#' + id) || {}).value || '';
  const last = cap(clean(val('pf-last'))), first = cap(clean(val('pf-first'))), middle = cap(clean(val('pf-middle'))), birth = val('pf-birth');
  const bad = [];
  if (!last) bad.push('pf-last');
  if (!first) bad.push('pf-first');
  if (!validIso(birth) || birth > todayIso() || birth < '1900-01-01') bad.push('pf-birth');
  document.querySelectorAll('.form-grid [aria-invalid]').forEach(el => el.removeAttribute('aria-invalid'));
  if (bad.length){
    bad.forEach(id => { const el = $('#' + id); if (el) el.setAttribute('aria-invalid', 'true'); });
    const box = document.querySelector('#pform .err-text');
    S.ui.formErr = bad.indexOf('pf-birth') >= 0 && bad.length === 1 ? 'Проверьте дату рождения.' : 'Заполните фамилию, имя и дату рождения.';
    if (box) box.textContent = S.ui.formErr; else { const row = document.querySelector('#pform .row.end'); if (row) row.insertAdjacentHTML('beforebegin', errBox(S.ui.formErr)); }
    const el = $('#' + bad[0]); if (el) el.focus();
    return;
  }
  if (isNew){
    const twin = [...S.patients.values()].find(x => norm(x.last) === norm(last) && norm(x.first) === norm(first) && x.birth === birth);
    if (twin && !confirm('Пациент «' + fio(twin) + '» с такой же датой рождения уже есть. Всё равно добавить ещё одного?')) return;
  }
  const p = isNew ? {id: uid(), createdAt: Date.now()} : pat(S.ui.edit);
  if (!p) return;
  Object.assign(p, {last, first, middle, birth, sex: val('pf-sex') === 'м' ? 'м' : 'ж', card: clean(val('pf-card')), wasBefore: !!($('#pf-before') || {}).checked,
    allergy: val('pf-allergy').trim(), chronic: val('pf-chronic').trim(), meds: val('pf-meds').trim(), note: val('pf-note').trim(), openedAt: Date.now()});
  S.patients.set(p.id, p); queue('patients', p);
  S.ui.edit = null; S.ui.formErr = ''; S.ui.vid = null;
  if (isNew && S.ui.from === 'start'){ S.ui.start = {step: 'proc', pid: p.id}; S.ui.pid = null; } else { S.ui.start = null; S.ui.pid = p.id; }
  S.ui.from = '';
  render(); window.scrollTo(0, 0);
  toast(isNew ? 'Пациент добавлен.' : 'Данные пациента сохранены.');
}

/* карта пациента */
function visitSummary(v){
  const bits = [];
  if (v.flags.drug && v.drug) bits.push(esc(v.drug) + (v.batch ? ', серия <span class="mono">' + esc(v.batch) + '</span>' : ''));
  if (v.flags.inject && v.points.length) bits.push(fmtNum(total(v)) + ' ' + esc(v.unit));
  return bits.join(' · ');
}
function histHtml(vs, skipId){
  const list = vs.filter(v => v.id !== skipId);
  if (!list.length) return '<p class="muted small">Визитов в программе ещё не было.</p>';
  return list.map(v => {
    const sum = visitSummary(v);
    return '<button type="button" class="hist-item" data-act="open-visit" data-vid="' + v.id + '"><b>' + fmtLong(v.date) + '</b> · ' + esc(v.procName) + ' ' + statusChip(v) +
      (sum ? '<span class="said muted">' + sum + '</span>' : '') +
      (v.diag ? '<span class="said">' + esc(v.diag.length > 160 ? v.diag.slice(0, 157) + '…' : v.diag) + '</span>' : '') + '</button>';
  }).join('');
}
function patientHead(p, skipVid, extraRight){
  const line = [ageWord(age(p.birth)), p.birth ? 'д. р. ' + fmtDot(p.birth) : '', p.card ? 'карта № ' + esc(p.card) : ''].filter(Boolean).join(' · ');
  const kind = isRepeatPatient(p) ? '<span class="chip kind">повторный</span>' : '<span class="chip info">первичный</span>';
  return '<div class="card stack"><div class="patient-head"><div><h2>' + esc(fio(p)) + '</h2><p class="muted" style="margin-top:4px">' + line + '</p></div>' +
    '<div class="row">' + (extraRight || kind) + '<button type="button" class="btn small" data-act="edit-patient" data-pid="' + p.id + '">Изменить</button></div></div>' + allergyAlert(p) +
    '<div class="facts"><div><h3 style="margin-bottom:8px">Анамнез</h3><dl class="kv"><dt>Аллергия</dt><dd>' + dash(p.allergy) + '</dd><dt>Хронические</dt><dd>' + dash(p.chronic) + '</dd><dt>Принимает</dt><dd>' + dash(p.meds) + '</dd><dt>Заметки</dt><dd>' + dash(p.note) + '</dd></dl></div>' +
    '<div><h3 style="margin-bottom:8px">' + (skipVid ? 'Прошлые визиты' : 'Визиты') + '</h3><div class="hist">' + histHtml(visitsOf(p.id), skipVid) + '</div></div></div></div>';
}
function procOptions(sel){ return S.settings.procs.map(x => '<option value="' + esc(x.id) + '"' + (x.id === sel ? ' selected' : '') + '>' + esc(x.name) + '</option>').join(''); }
function allergyAlert(p){
  const a = clean(p.allergy);
  if (!a || /^(нет|не выявлено|не выявлена|отрицает|отрицает аллергию|нет данных|—|-)\.?$/i.test(a)) return '';
  return '<div class="alert-allergy" role="note"><b>Аллергия:</b> ' + esc(a) + '</div>';
}

const total = v => v.points.reduce((s, q) => s + num(q.u), 0);
function missing(v){

  if (v.flags.consent && !v.consent) m.push('подписанное согласие на процедуру');

}

const delBtn = (act, plan, i) => '<button type="button" class="btn-ghost btn del" data-act="' + act + '" data-plan="' + plan + '" data-i="' + i + '" aria-label="Удалить строку ' + (i + 1) + '"><span aria-hidden="true">×</span><span class="del-t">Удалить строку</span></button>';
const planRowsOf = pl => pl.rows.filter(r => r.date || r.svc || r.dose || r.zone);
function linkedLine(pl){ return 'Вид плана и дата — как в плане лечения: ' + PLAN_TYPES[pl.type] + (pl.from ? ' от ' + fmtDot(pl.from) : '') + '.'; }
function planCards(p){
  const pl = curPlan(p.id);
  if (!pl) return '<section class="card"><div class="card-head"><div><h2 style="font-size:17px">План лечения и рекомендации</h2><p class="note" style="margin-top:3px">Ваши бланки «План лечения» и «Рекомендации». Заполняете здесь — печатаются уже заполненными.</p></div>' +
    '<button type="button" class="btn" data-act="plan-new" data-pid="' + p.id + '">Составить план</button></div></section>';
  return planCard(pl) + recsCard(pl) + oldPlans(p, pl);
}
function planCard(pl){
  const types = PLAN_TYPES.map((t, i) => '<label><input type="radio" name="ptype-' + pl.id + '" data-f="ptype" data-plan="' + pl.id + '" value="' + i + '"' + (pl.type === i ? ' checked' : '') + '>' + t + '</label>').join('');
  const rows = pl.rows.map((r, i) => '<div class="prow plan">' +
    cell('Дата следующего визита', '<input type="date" data-f="plan" data-plan="' + pl.id + '" data-k="date" data-i="' + i + '" value="' + esc(r.date) + '" aria-label="Дата следующего визита, строка ' + (i + 1) + '">') +
    cell('Услуга', '<input type="text" list="dl-svc" data-f="plan" data-plan="' + pl.id + '" data-k="svc" data-i="' + i + '" value="' + esc(r.svc) + '" aria-label="Услуга, строка ' + (i + 1) + '" autocomplete="off">') +
    cell('Дозировка / количество', '<input type="text" data-f="plan" data-plan="' + pl.id + '" data-k="dose" data-i="' + i + '" value="' + esc(r.dose) + '" aria-label="Дозировка или количество, строка ' + (i + 1) + '" autocomplete="off">') +
    cell('Зона', '<input type="text" list="dl-zone" data-f="plan" data-plan="' + pl.id + '" data-k="zone" data-i="' + i + '" value="' + esc(r.zone) + '" aria-label="Зона, строка ' + (i + 1) + '" autocomplete="off">') +
    delBtn('plan-del', pl.id, i) + '</div>').join('');
  return '<section class="card stack" aria-label="План лечения">' +
    '<div class="card-head"><div><h2 style="font-size:17px">План лечения</h2><p class="note" style="margin-top:3px">Заполняете здесь — бланк печатается уже заполненным.</p></div>' +
      '<div class="row"><button type="button" class="btn" data-act="print-plan" data-plan="' + pl.id + '" data-tab="plan">' + ICON_PRINT + 'Бланк для печати</button><button type="button" class="btn btn-ghost" data-act="plan-new" data-pid="' + pl.pid + '">Новый план</button></div></div>' +
    '<div class="ptype"><div class="radio-seg" role="radiogroup" aria-label="Вид плана">' + types + '</div>' +
      '<label class="field from">от<input type="date" data-f="pfrom" data-plan="' + pl.id + '" value="' + esc(pl.from) + '" aria-label="Дата плана"></label></div>' +
    '<div class="prows"><div class="prow plan head" aria-hidden="true"><span>Дата следующего визита</span><span>Услуга</span><span>Дозировка / количество</span><span>Зона</span><span></span></div>' +
      (rows || '<p class="muted small">Строк пока нет</p>') + '</div>' +
    '<div class="row"><button type="button" class="btn" data-act="plan-add" data-plan="' + pl.id + '">+ Добавить строку</button></div></section>';
}
function recsCard(pl){
  const dirs = pl.dirs.map((r, i) => '<div class="prow dir">' +
    cell('Дата', '<input type="date" data-f="dir" data-plan="' + pl.id + '" data-k="date" data-i="' + i + '" value="' + esc(r.date) + '" aria-label="Дата, направление ' + (i + 1) + '">') +
    cell('Направление', '<input type="text" list="dl-dir" data-f="dir" data-plan="' + pl.id + '" data-k="dir" data-i="' + i + '" value="' + esc(r.dir) + '" aria-label="Направление услуг, строка ' + (i + 1) + '" autocomplete="off">') +
    delBtn('dir-del', pl.id, i) + '</div>').join('');
  const cos = pl.cosm.map((r, i) => '<div class="prow cosm">' +
    cell('Наименование', '<input type="text" list="dl-cosm" data-f="cosm" data-plan="' + pl.id + '" data-k="name" data-i="' + i + '" value="' + esc(r.name) + '" aria-label="Средство, строка ' + (i + 1) + '" autocomplete="off">') +
    cell('Правила применения', '<input type="text" data-f="cosm" data-plan="' + pl.id + '" data-k="rule" data-i="' + i + '" value="' + esc(r.rule) + '" aria-label="Правила применения, строка ' + (i + 1) + '" autocomplete="off">') +
    delBtn('cosm-del', pl.id, i) + '</div>').join('');
  return '<section class="card stack" aria-label="Рекомендации">' +
    '<div class="card-head"><div><h2 style="font-size:17px">Рекомендации</h2><p class="note" style="margin-top:3px">Другие направления услуг и домашний уход. Выберите средство из списка — правила применения подставятся сами.</p></div>' +
      '<button type="button" class="btn" data-act="print-plan" data-plan="' + pl.id + '" data-tab="recs">' + ICON_PRINT + 'Бланк для печати</button></div>' +
    '<p class="linked" data-linked="' + pl.id + '">' + esc(linkedLine(pl)) + '</p>' +
    '<h3 class="sub-h">На другие направления услуг</h3>' +
    '<div class="prows"><div class="prow dir head" aria-hidden="true"><span>Дата</span><span>Направление</span><span></span></div>' + (dirs || '<p class="muted small">Строк пока нет</p>') + '</div>' +
    '<div class="row"><button type="button" class="btn" data-act="dir-add" data-plan="' + pl.id + '">+ Добавить направление</button></div>' +
    '<h3 class="sub-h">По косметике</h3>' +
    '<div class="prows"><div class="prow cosm head" aria-hidden="true"><span>Наименование</span><span>Правила применения</span><span></span></div>' + (cos || '<p class="muted small">Строк пока нет</p>') + '</div>' +
    '<div class="row"><button type="button" class="btn" data-act="cosm-add" data-plan="' + pl.id + '">+ Добавить средство</button></div></section>';
}
function oldPlans(p, cur){
  const old = plansOf(p.id).filter(x => x.id !== cur.id);
  if (!old.length) return '';
  return '<section class="card"><details class="old"><summary>Прошлые планы: ' + old.length + '</summary><div class="list">' + old.map(x =>
    '<div class="li"><div><b>' + PLAN_TYPES[x.type] + (x.from ? ' от ' + fmtDot(x.from) : '') + '</b><div class="small muted">визитов в плане: ' + planRowsOf(x).length + '</div></div>' +
    '<button type="button" class="btn small" data-act="print-plan" data-plan="' + x.id + '" data-tab="plan">' + ICON_PRINT + 'Бланки</button></div>').join('') + '</div></details></section>';
}
function newPlan(pid){
  const pl = {id: uid(), pid, type: 0, from: todayIso(), rows: [R(), R(), R()], dirs: [{date: '', dir: ''}], cosm: [{name: '', rule: ''}, {name: '', rule: ''}], createdAt: Date.now()};
  S.plans.set(pl.id, pl); queue('plans', pl);
  return pl;
}

/* ---------- бумага: бланки клиники, запись о приёме, памятка ---------- */
function blankHead(title){
  const c = S.settings.clinic;
  const logo = imgSrc(c.logo), qr = imgSrc(c.qr);
  const left = logo ? '<img src="' + logo + '" alt="">' : '<div class="bl-name">' + esc(c.name) + '</div>';
  const care = [c.careTitle, c.phone, c.site].filter(x => x && String(x).trim()).map(esc).join('<br>');
  return '<div class="bl-head"><div class="bl-l">' + left + '</div><div class="bl-title">' + title + '</div>' +
    '<div class="bl-care">' + (care ? '<div>' + care + '</div>' : '') + (qr ? '<img src="' + qr + '" alt="">' : '') + '</div></div>';
}
function blankTop(pl, p){
  return '<div class="bl-opts">' + PLAN_TYPES.map((t, i) => '<span class="bl-opt' + (pl.type === i ? ' on' : '') + '"><i></i>' + t + '</span>').join('') +
      '<span class="bl-from">от <span class="bl-line">' + (pl.from ? fmtDot(pl.from) : '&nbsp;') + '</span></span></div>' +
    '<div class="bl-fio"><span>ФИО пациента</span><span class="bl-line">' + esc(fio(p)) + '</span></div>';
}
function blankRows(items, n, cols){
  let out = '';
  for (let i = 0; i < Math.max(n, items.length); i++){ const r = items[i]; out += '<tr>' + cols.map(c => '<td>' + (r ? (c === 'date' ? fmtDot(r[c]) : esc(r[c])) : '') + '</td>').join('') + '</tr>'; }
  return out;
}
function planPaper(pl, p){
  const rows = planRowsOf(pl).slice().sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999'));
  const n = Math.max(S.settings.blank.planRows, rows.length);
  return '<div class="paper blank plan" style="--rows:' + n + '">' + blankHead('План лечения') + blankTop(pl, p) +
    '<table><colgroup><col style="width:21%"><col style="width:31%"><col style="width:24%"><col style="width:24%"></colgroup>' +
    '<thead><tr><th>Дата следующего визита</th><th>Услуга</th><th>Дозировка / Количество</th><th>Зона</th></tr></thead>' +
    '<tbody>' + blankRows(rows, S.settings.blank.planRows, ['date', 'svc', 'dose', 'zone']) + '</tbody></table></div>';
}
function recsPaper(pl, p){
  const dirs = pl.dirs.filter(r => r.date || r.dir).slice().sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999'));
  const cos = pl.cosm.filter(r => r.name || r.rule);
  const n = Math.max(S.settings.blank.dirRows, dirs.length) + Math.max(S.settings.blank.cosmRows, cos.length);
  return '<div class="paper blank recs" style="--rows:' + n + '">' + blankHead('Рекомендации') + blankTop(pl, p) +
    '<div class="bl-sec">Рекомендация на другие направления услуг:</div>' +
    '<table><colgroup><col style="width:24%"><col style="width:76%"></colgroup><thead><tr><th>Дата</th><th>Направление</th></tr></thead>' +
    '<tbody>' + blankRows(dirs, S.settings.blank.dirRows, ['date', 'dir']) + '</tbody></table>' +
    '<div class="bl-sec">Рекомендация по косметике:</div>' +
    '<table><colgroup><col style="width:40%"><col style="width:60%"></colgroup><thead><tr><th>Наименование</th><th>Правила применения</th></tr></thead>' +
    '<tbody>' + blankRows(cos, S.settings.blank.cosmRows, ['name', 'rule']) + '</tbody></table></div>';
}
const lineItem = (a, b) => '<div class="lineitem"><span>' + a + '</span><span class="filled">' + b + '</span></div>';
const secP = (title, text) => '<div class="sec"><b>' + title + '</b><p>' + (text && String(text).trim() ? esc(text) : '—') + '</p></div>';
function paperTop(right){
  const c = S.settings.clinic;
  const logo = imgSrc(c.logo);
  return '<div class="rec-top"><div>' + (logo ? '<img src="' + logo + '" alt="">' : '<b>' + esc(c.name) + '</b>') + '</div>' + (right ? '<div class="small" style="text-align:right">' + right + '</div>' : '') + '</div>';
}
function recPaper(v, p){
  const pts = v.points.map(q => '<li>' + fmtNum(num(q.u)) + ' ' + esc(v.unit) + '</li>').join('');
  const fixed = (v.log || []).filter(l => /^Открыт для исправления/.test(l.what)).map(l => fmtDT(l.at)).join(', ');
  return '<div class="paper rec">' + paperTop('Запись о приёме<br>для медицинской карты (форма 025/у)') +
    '<h4>' + esc(v.procName) + '</h4><div class="sub">' + fmtLong(v.date) + ', ' + v.time + ' · ' + v.kind + ' приём</div>' +
    lineItem('Пациент', esc(fio(p)) + (p.birth ? ', ' + fmtDot(p.birth) + ' г. р.' : '')) +
    (p.card ? lineItem('№ медицинской карты', esc(p.card)) : '') +
    lineItem('Специалист', esc(v.doctor)) +
    secP('Жалобы и осмотр', v.diag) +
    (v.dx && v.dx.trim() ? secP('Диагноз', v.dx) : '') +
    (v.flags.drug ? secP('Препарат', [v.drug, v.batch ? 'серия ' + v.batch : '', v.expiry ? 'годен до ' + v.expiry : ''].filter(Boolean).join(', ')) : '') +
    (v.flags.inject ? '<div class="sec"><b>Введено</b><div class="rec-map">' + faceSvgPrint(v) + '<div><p><strong>Всего: ' + fmtNum(total(v)) + ' ' + esc(v.unit) + '</strong>, точек введения: ' + v.points.length + '</p><ol>' + pts + '</ol></div></div></div>' : '') +
    (p.pdConsentAt ? secP('Согласие на обработку персональных данных', 'подписано ' + fmtDot(p.pdConsentAt)) : '') +
    (v.flags.consent ? secP('Информированное добровольное согласие', v.consent ? 'подписано' : 'не подписано') : '') +
    (v.flags.memo ? secP('Рекомендации после процедуры', v.memo) : '') +
    '<div class="sign"><span>Дата: ' + fmtDot(v.date) + '</span><span>Специалист: ____________ / ' + esc(shortName(v.doctor)) + '</span></div>' +
    (fixed ? '<p class="foot-note">Запись исправлялась: ' + fixed + '.</p>' : '') +
    (v.status !== 'done' ? '<p class="foot-note">Визит ещё не завершён.</p>' : '') + '</div>';
}
function memoPaper(v, p){
  const c = S.settings.clinic;
  const items = lines(v.memo).reduce((a, l) => a.concat(l.split(/(?<=[.!?])\s+(?=[А-ЯЁA-Z0-9«])/)), []).filter(Boolean);
  return '<div class="paper memo">' + paperTop([c.careTitle, c.phone].filter(x => x && String(x).trim()).map(esc).join('<br>')) +
    '<h4>Памятка после процедуры</h4><div class="sub">' + esc(v.procName) + ' · ' + fmtLong(v.date) + '</div>' +
    lineItem('Пациент', esc(fio(p))) +
    '<ul>' + items.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>' +
    (c.phone ? '<p class="foot-note">Если что-то беспокоит — позвоните нам' + (c.careTitle ? ' (' + esc(c.careTitle) + ')' : '') + ': ' + esc(c.phone) + '</p>' : '') +
    '<div class="sign"><span>Специалист: ' + esc(shortName(v.doctor)) + '</span><span>Дата: ' + fmtDot(v.date) + '</span></div></div>';
}

      (pr ? '<b>«' + esc(pr.name) + '»</b>' : fillLine(80)) + '.</p>' +

/* окно печати */
function renderModal(){
  const box = document.getElementById('overlay');
  const M = S.ui.modal;
  if (!M || S.locked || !S.settings || S.fatal){ box.hidden = true; box.innerHTML = ''; document.body.classList.remove('modal-open'); return; }
  let title, sub, tabs, paper, note;
  if (M.kind === 'plan'){
    const pl = S.plans.get(M.id), p = pl && pat(pl.pid);
    if (!p){ S.ui.modal = null; return renderModal(); }
    title = fio(p); sub = PLAN_TYPES[pl.type] + (pl.from ? ' от ' + fmtDot(pl.from) : '');
    tabs = [['plan', 'План лечения'], ['recs', 'Рекомендации']];
    paper = M.tab === 'recs' ? recsPaper(pl, p) : planPaper(pl, p);
    note = 'Бланк печатается на одном листе А4. В окне печати можно выбрать «Сохранить как PDF».';
  } else if (M.kind === 'memo-blank'){
    const pr = procById(M.proc); if (!pr){ S.ui.modal = null; return renderModal(); }
    title = 'Памятка после процедуры'; sub = pr.name; tabs = []; paper = memoBlankPaper(pr); note = 'Текст памятки меняется в «Настройки › Процедуры».';
  } else if (M.kind === 'docs'){
    const p = M.pid ? pat(M.pid) : null;
    if (M.pid && !p){ S.ui.modal = null; return renderModal(); }
    const pr = M.proc === '' ? null : (procById(M.proc) || S.settings.procs.find(x => x.consent) || S.settings.procs[0]);
    title = p ? fio(p) : 'Пустые бланки'; sub = p ? 'Документы на подпись' : 'Для заполнения от руки';
    tabs = [['ids', 'Согласие на процедуру'], ['pd', 'Согласие на обработку данных']].concat(p ? [] : [['plan', 'План лечения'], ['recs', 'Рекомендации']]);

function doPrint(){

}

function readImage(file, maxSide){
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Выберите картинку PNG или JPG.'));
    if (file.size > 8e6) return rej(new Error('Картинка слишком большая — нужна меньше 8 МБ.'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
      const w = Math.max(1, Math.round((img.naturalWidth || maxSide) * k)), h = Math.max(1, Math.round((img.naturalHeight || maxSide) * k));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/png'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Не получилось прочитать картинку.')); };
    img.src = url;
  });
}

/* ---------- шаблоны фраз при наборе ---------- */
const TPL = {kind: null, items: [], on: -1};
const WORD = /[A-Za-zА-Яа-яЁё0-9-]+$/;
function resetTpl(){ TPL.kind = null; TPL.items = []; TPL.on = -1; }
function fragAt(ta){
  const pos = ta.selectionStart == null ? ta.value.length : ta.selectionStart;
  const sent = ta.value.slice(0, pos).match(/[^.!?\n]*$/)[0];
  const w = sent.match(WORD);
  return {pos, sent, word: w ? w[0] : ''};
}
function tplMatches(kind, f, value){
  if (f.word.length < 2) return [];
  const w = norm(f.word), lead = norm(f.sent.slice(0, f.sent.length - f.word.length).trim()), have = norm(value);
  const out = [];
  (S.settings.tpl[kind] || []).forEach((t, idx) => {
    const nt = norm(t);
    if (have.indexOf(nt) >= 0) return;
    const words = nt.match(/[a-zа-я0-9-]+/g) || [];
    const wi = words.findIndex(x => x.startsWith(w));
    if (wi < 0) return;
    out.push({t, idx, score: (wi === 0 ? 0 : 1) - (lead && nt.startsWith(lead) ? 2 : 0)});
  });
  out.sort((a, b) => a.score - b.score || a.idx - b.idx);
  return out.slice(0, 6).map(x => x.t);
}
function hl(t, w){
  const nw = norm(w), re = /[A-Za-zА-Яа-яЁё0-9-]+/g; let m;
  while ((m = re.exec(t))){ if (norm(m[0]).startsWith(nw)){ const a = m.index, b = a + w.length; return esc(t.slice(0, a)) + '<b>' + esc(t.slice(a, b)) + '</b>' + esc(t.slice(b)); } }
  return esc(t);
}
function showTpl(ta){
  const kind = ta.dataset.tpl, box = document.getElementById('tpl-' + kind); if (!box) return;
  const f = fragAt(ta), items = tplMatches(kind, f, ta.value);
  TPL.kind = kind; TPL.items = items; TPL.on = -1;
  if (!items.length){ box.hidden = true; box.innerHTML = ''; return; }
  const wasHidden = box.hidden;
  box.innerHTML = '<span class="tpl-h">Шаблоны — нажмите, чтобы вставить (или стрелки и Enter)</span>' + items.map((t, i) => '<button type="button" role="option" aria-selected="false" data-act="tpl" data-kind="' + kind + '" data-i="' + i + '">' + hl(t, f.word) + '</button>').join('');
  box.hidden = false;
  if (wasHidden && box.scrollIntoView){ try { box.scrollIntoView({block: 'nearest'}); } catch (e){} }
}
function hideTpl(){ document.querySelectorAll('.tpl').forEach(b => { b.hidden = true; b.innerHTML = ''; }); resetTpl(); }
function markTpl(){ const box = TPL.kind && document.getElementById('tpl-' + TPL.kind); if (!box) return;
  box.querySelectorAll('button').forEach((b, i) => { b.classList.toggle('on', i === TPL.on); b.setAttribute('aria-selected', String(i === TPL.on)); }); }
function applyTpl(ta, t){
  const f = fragAt(ta), v = ta.value;
  const lead = norm(f.sent.slice(0, f.sent.length - f.word.length).trim());
  let start, ins;
  if (lead && norm(t).startsWith(lead)){ start = f.pos - f.sent.length + (f.sent.length - f.sent.replace(/^\s+/, '').length); ins = t; }
  else if (!lead){ start = f.pos - f.word.length; ins = t; }
  else { start = f.pos - f.word.length; ins = t.charAt(0).toLowerCase() + t.slice(1); }
  const pre = v.slice(0, start), after = v.slice(f.pos).replace(/^[A-Za-zА-Яа-яЁё0-9-]+/, '');
  const lead2 = pre && !/\s$/.test(pre) ? ' ' : '';
  const tail = after && /^\s/.test(after) ? '' : ' ';
  ta.value = pre + lead2 + ins + tail + after;
  const caret = (pre + lead2 + ins + tail).length;
  ta.focus(); ta.setSelectionRange(caret, caret);
  ta.dispatchEvent(new Event('input', {bubbles: true}));
}

let lockGen = 0;   // если успели войти снова, пока дописывались изменения, — ничего не стираем

  if (!S.settings || S.locked) return;

/* неверный PIN: счётчик хранится в браузере, перезагрузка страницы его не сбрасывает */
async function pinFailed(){
  const L = S.lock;
  L.fails++;
  L.until = L.fails >= 5 && L.fails < HARD_FAILS ? Date.now() + 30000 * (L.fails - 4) : 0;
  L.err = L.fails >= HARD_FAILS ? '' : L.fails >= 5 ? 'Неверный PIN. Следующая попытка — через ' + 30 * (L.fails - 4) + ' с.' : 'Неверный PIN.';
  await saveLock();
}
async function unlock(pin){
  const L = S.lock;
  if (L.busy || !S.locked) return;
  if (L.fails >= HARD_FAILS) return render();
  if (L.until > Date.now()){ L.err = 'Слишком много попыток. Подождите ' + Math.ceil((L.until - Date.now()) / 1000) + ' с.'; return render(); }
  if (!pin){ L.err = 'Введите PIN.'; return render(); }
  L.busy = true; L.err = ''; render();
  let key = null;
  try { key = await keyFromPin(pin); }
  catch (e){ console.error(e); L.busy = false; L.err = 'Не получилось открыть данные: ' + (e.message || e) + '. Напишите в поддержку: Telegram @aikiren.'; return render(); }
  if (!key){ L.busy = false; await pinFailed(); return render(); }
  try { await openWith(key); }
  catch (e){ console.error(e); S.dk = null; L.busy = false; L.err = 'Не получилось открыть данные: ' + (e.message || e); render(); }
}

      queue('visits', v); render(); return;
    }
    case 'pt-del': if (v && v.status !== 'done'){ v.points.splice(+el.dataset.i, 1); queue('visits', v); render(); } return;
    case 'again': {
      if (!v || v.status === 'done') return;
      const h = lastSame(v); if (!h) return;
      const got = [];
      if (v.flags.drug && h.drug){ v.drug = h.drug; got.push('препарат'); }
      if (v.flags.inject && h.points.length){ v.points = h.points.map(q => ({x: q.x, y: q.y, u: q.u})); got.push('схема уколов (' + h.points.length + ')'); }
      if (h.diag){ v.diag = h.diag; v.dx = h.dx || v.dx || ''; got.push('жалобы и осмотр'); }
      if (v.flags.memo && h.memo){ v.memo = h.memo; got.push('памятка'); }
      v.copiedFrom = h.date; v.log.push({at: Date.now(), what: 'Заполнен по визиту ' + fmtDot(h.date)});
      queue('visits', v); render();
      toast('Перенесено из визита ' + fmtShort(h.date) + ': ' + got.join(', ') + '. Серию и срок годности впишите с новой упаковки.', 6500);
      return;
    }
    case 'finish': {
      if (!v || missing(v).length) return;
      const again = (v.log || []).some(l => /Завершён/.test(l.what));
      v.status = 'done'; v.doneAt = Date.now(); v.log.push({at: Date.now(), what: again ? 'Завершён после исправления' : 'Завершён'});
      queue('visits', v); flush(); renderDatalists(); render(); window.scrollTo(0, 0);
      toast('Приём завершён. Что дальше — вверху страницы.', 4500);
      return;
    }
    case 'reopen': {
      if (!v || v.status !== 'done') return;
      if (!confirm('Открыть визит для исправления? В записи останется отметка, что её исправляли.')) return;
      v.status = 'draft'; v.log.push({at: Date.now(), what: 'Открыт для исправления'});
      queue('visits', v); render(); return;
    }
    case 'del-visit': {
      if (!v || v.status === 'done') return;
      if (!confirm('Удалить этот незавершённый приём? Всё, что в нём заполнено, удалится.')) return;
      S.visits.delete(v.id); queueDel('visits', v.id);
      S.ui.vid = null; render(); toast('Приём удалён.'); return;
    }
    case 'print-visit': return openModal({kind: 'visit', id: S.ui.vid, tab: el.dataset.tab});
    case 'tpl': { const ta = document.querySelector('textarea[data-tpl="' + el.dataset.kind + '"]'), t = TPL.items[+el.dataset.i]; if (ta && t) applyTpl(ta, t); return; }
    /* план и рекомендации */
    case 'plan-new': {
      const cur = curPlan(el.dataset.pid);
      if (cur && !confirm('Начать новый план лечения? Текущий план от ' + (fmtDot(cur.from) || 'без даты') + ' сохранится в «Прошлых планах».')) return;
      newPlan(el.dataset.pid); render(); return;
    }
    case 'plan-add': { const pl = planFor(el); if (!pl) return; pl.rows.push(R()); queue('plans', pl); render(); const f = document.querySelector('[data-f="plan"][data-plan="' + pl.id + '"][data-k="date"][data-i="' + (pl.rows.length - 1) + '"]'); if (f) f.focus(); return; }
    case 'plan-del': { const pl = planFor(el); if (!pl) return; pl.rows.splice(+el.dataset.i, 1); queue('plans', pl); render(); return; }
    case 'dir-add': { const pl = planFor(el); if (!pl) return; pl.dirs.push({date: '', dir: ''}); queue('plans', pl); render(); const f = document.querySelector('[data-f="dir"][data-plan="' + pl.id + '"][data-k="dir"][data-i="' + (pl.dirs.length - 1) + '"]'); if (f) f.focus(); return; }
    case 'dir-del': { const pl = planFor(el); if (!pl) return; pl.dirs.splice(+el.dataset.i, 1); queue('plans', pl); render(); return; }
    case 'cosm-add': { const pl = planFor(el); if (!pl) return; pl.cosm.push({name: '', rule: ''}); queue('plans', pl); render(); const f = document.querySelector('[data-f="cosm"][data-plan="' + pl.id + '"][data-k="name"][data-i="' + (pl.cosm.length - 1) + '"]'); if (f) f.focus(); return; }
    case 'cosm-del': { const pl = planFor(el); if (!pl) return; pl.cosm.splice(+el.dataset.i, 1); queue('plans', pl); render(); return; }
    case 'print-plan': flush(); return openModal({kind: 'plan', id: el.dataset.plan, tab: el.dataset.tab});
    case 'print-docs': flush(); return openModal({kind: 'docs', pid: el.dataset.pid, tab: el.dataset.tab, proc: el.dataset.proc, date: el.dataset.date});
    case 'print-blanks': return openModal({kind: 'docs', pid: null, tab: 'ids'});
    case 'nav-help': S.ui.view = 'help'; S.ui.modal = null; render(); return window.scrollTo(0, 0);
    case 'goto-docs': S.ui.view = 'settings'; S.ui.stab = 'clinic'; render(); return window.scrollTo(0, 0);
    case 'print-help': { const root = document.getElementById('print-root'); root.innerHTML = '<div class="paper guide">' + helpBody() + '</div>'; setTimeout(() => { try { window.print(); } catch (err){ toast('Печать не открылась. Нажмите Ctrl+P.'); } }, 50); return; }
    case 'doc-reset': { const k = el.dataset.key; if (!confirm('Вернуть образец текста? Ваш текст заменится.')) return; S.settings.docs[k] = DEF.docs[k]; saveSettings(); render(); toast('Образец возвращён.'); return; }
    /* окно печати */
    case 'tab': S.ui.modal.tab = el.dataset.tab; renderModal(); { const b = document.querySelector('#overlay [data-act="tab"][data-tab="' + el.dataset.tab + '"]'); if (b) b.focus(); } return;
    case 'do-print': return doPrint();
    case 'close': return closeModal();
    /* настройки */
    case 'img-del': S.settings.clinic[el.dataset.key] = ''; saveSettings(); render(); return;
    case 'proc-add': { const np = Object.assign(proc(uid(), 'Новая процедура', true, false, '', 1, 0, ''), {memoOn: false}); S.settings.procs.push(np); S.ui.openProc = np.id; saveSettings(); render(); const f = document.querySelector('details.proc[open] [data-p="name"]'); if (f){ f.focus(); f.select(); } return; }
    case 'proc-del': {
      const i = +el.dataset.pi, p = S.settings.procs[i]; if (!p) return;
      if (S.settings.procs.length <= 1){ toast('Должна остаться хотя бы одна процедура.'); return; }
      if (!confirm('Удалить процедуру «' + p.name + '» из списка? Прошлые записи с ней останутся.')) return;
      S.settings.procs.splice(i, 1); saveSettings(); render(); return;
    }
    case 'change-pin': {
      const X = S.sec, sec = S.settings.security; X.pinErr = X.pinOk = '';
      if (X.busy) return;
      const cur = ($('#sp-cur') || {}).value || '', a = ($('#sp-new') || {}).value || '', b = ($('#sp-new2') || {}).value || '';
      const pe = newPinError(a, b);
      if (pe){ X.pinErr = pe; return render(); }
      if (!sec.dkPin){ X.pinErr = 'Сначала заблокируйте программу и войдите заново.'; return render(); }
      X.busy = true; render();
      let raw;
      try { raw = await unwrapDk(cur, sec.dkPin); }
      catch (err){
        X.busy = false;
        await pinFailed();   // подбор PIN через настройки тоже считается
        if (S.lock.fails >= 5){ lockNow(); return; }
        X.pinErr = 'Текущий PIN неверный.'; return render();
      }
      sec.dkPin = await wrapDk(a, raw); raw.fill(0);
      delete sec.shortPin;
      S.lock.fails = 0; S.lock.until = 0; S.lock.err = ''; await saveLock();
      saveSettings(); await flush(); X.busy = false; X.pinOk = 'PIN изменён.'; return render();
    }
    case 'change-pw': {
      const X = S.sec, sec = S.settings.security; X.pwErr = X.pwOk = '';
      if (X.busy) return;
      const cur = ($('#sw-cur') || {}).value || '', a = ($('#sw-new') || {}).value || '', b = ($('#sw-new2') || {}).value || '';
      const pe = newPwError(a, b);
      if (pe){ X.pwErr = pe; return render(); }
      X.busy = true; render();
      let pkcs8;
      try { pkcs8 = await unwrapPkcs8(cur, sec.wrap); } catch (err){ X.busy = false; X.pwErr = 'Текущий пароль клиники неверный.'; return render(); }
      sec.wrap = await wrapPkcs8(a, pkcs8);
      saveSettings(); await flush(); X.busy = false; X.pwOk = 'Пароль клиники изменён. Сохраните новую копию в разделе «Копии и данные».'; return render();
    }
    case 'wipe': {
      const X = S.sec; X.delErr = '';
      const pw = ($('#del-pw') || {}).value || '';
      X.busy = true; render();
      try { await unwrapPkcs8(pw, S.settings.security.wrap); } catch (err){ X.busy = false; X.delErr = 'Неверный пароль клиники.'; return render(); }
      X.busy = false;
      if (!confirm('Удалить всех пациентов, визиты, планы и настройки с этого компьютера?\n\nЭто нельзя отменить. Восстановить можно только из сохранённой копии.')) return render();
      pending.clear(); await saving.catch(() => {});
      await DB.write(STORES.map(s => ({op: 'clear', store: s})).concat(keepLicenseOps()));
      S.settings = null; S.dk = null; S.patients = new Map(); S.visits = new Map(); S.plans = new Map();
      S.lock = {mode: 'pin', err: '', busy: false, fails: 0, until: 0};
      S.ui = freshUi(); S.setup = freshSetup(); S.sec = {pinErr: '', pinOk: '', pwErr: '', pwOk: '', delErr: '', busy: false};
      document.getElementById('datalists').innerHTML = '';
      render(); toast('Все данные с этого компьютера удалены.'); return;
    }
  }
}

function onInput(e){
  const t = e.target;
  if (t.dataset.sf){ S.setup[t.dataset.sf] = t.value; return; }
  const f = t.dataset.f; if (!f) return;
  if (f === 'q'){ S.ui.q = t.value; S.ui.plimit = 200; const box = document.getElementById('patient-list'); if (box) box.innerHTML = patientListHtml(); return; }
  if (f === 'sq'){ S.ui.sq = t.value; const box = document.getElementById('start-results'); if (box) box.innerHTML = startResultsHtml(); return; }
  if (f === 'dq'){ S.ui.dq = t.value; const box = document.getElementById('drug-list'); if (box) box.innerHTML = drugListHtml(); return; }
  if (f === 'jq'){ S.ui.jq = t.value; S.ui.jlimit = 60; const box = document.getElementById('journal-list'); if (box) box.innerHTML = journalListHtml(); return; }
  if (f === 'plan'){ const pl = planFor(t); if (!pl) return; pl.rows[+t.dataset.i][t.dataset.k] = t.value; queue('plans', pl); return; }
  if (f === 'dir' || f === 'cosm'){
    const pl = planFor(t); if (!pl) return;
    const row = pl[f === 'dir' ? 'dirs' : 'cosm'][+t.dataset.i]; row[t.dataset.k] = t.value;
    if (f === 'cosm' && t.dataset.k === 'name'){
      const hit = S.settings.lists.cosmetics.find(c => norm(c.name) === norm(t.value));
      if (hit && hit.rule && !row.rule.trim()){ row.rule = hit.rule; const r = document.querySelector('[data-f="cosm"][data-plan="' + pl.id + '"][data-k="rule"][data-i="' + t.dataset.i + '"]'); if (r) r.value = hit.rule; }
    }
    queue('plans', pl); return;
  }
  if (f === 'pfrom'){ const pl = planFor(t); if (!pl) return; pl.from = t.value; queue('plans', pl); const l = document.querySelector('[data-linked="' + pl.id + '"]'); if (l) l.textContent = linkedLine(pl); return; }
  const v = curVisit(); if (!v || v.status === 'done') return;
  if (f === 'diag' || f === 'memo'){ v[f] = t.value; queue('visits', v); refreshFinish(v); showTpl(t); return; }
  if (f === 'drug' || f === 'batch' || f === 'expiry' || f === 'dx'){ v[f] = t.value; queue('visits', v); refreshFinish(v); return; }
  if (f === 'pt'){ const q = v.points[+t.dataset.i]; if (!q) return; q.u = t.value; queue('visits', v); const s = document.getElementById('total-num'); if (s) s.textContent = fmtNum(total(v)) + ' ' + v.unit; return; }
}

async function onChange(e){
  const t = e.target;
  if (t.dataset.rs === 'file'){ S.restore.file = t.files && t.files[0] || null; S.restore.err = ''; render(); return; }
  if (t.dataset.s){
    let val = t.type === 'checkbox' ? t.checked : t.value;
    if (t.type === 'number' || t.dataset.numeric){ val = Math.round(num(val)); const mn = num(t.dataset.min || 0), mx = num(t.dataset.max || 9999); if (t.dataset.min) val = Math.max(mn, Math.min(mx, val)); t.value = val; }
    else if (typeof val === 'string') val = val.trim();
    if ((t.dataset.s === 'clinic.name' || t.dataset.s === 'doctor.fio') && !val){ toast('Это поле не может быть пустым.'); t.value = getPath(S.settings, t.dataset.s); return; }
    setPath(S.settings, t.dataset.s, val); saveSettings();
    if (/^(clinic\.name|doctor\.fio)$/.test(t.dataset.s)) render();
    return;
  }
  if (t.dataset.list){ setPath(S.settings, t.dataset.list, parseList(t.dataset.list, t.value)); saveSettings(); renderDatalists(); return; }
  if (t.dataset.p){
    const p = S.settings.procs[+t.dataset.pi]; if (!p) return;
    const k = t.dataset.p;
    if (t.type === 'checkbox') p[k] = t.checked;
    else if (k === 'step' || k === 'def') p[k] = Math.max(0, num(t.value));
    else p[k] = k === 'memo' ? t.value.trim() : clean(t.value);
    if (k === 'name' && !p.name){ p.name = 'Процедура'; t.value = p.name; }
    saveSettings(); return;
  }
  if (t.dataset.img){
    const file = t.files && t.files[0]; if (!file) return;
    try { S.settings.clinic[t.dataset.img] = await readImage(file, t.dataset.img === 'qr' ? 400 : 600); saveSettings(); render(); }
    catch (err){ toast(err.message || 'Не получилось загрузить картинку.'); }
    return;
  }
  const f = t.dataset.f; if (!f) return;
  if (f === 'jperiod'){ S.ui.jperiod = t.value; S.ui.jlimit = 60; const box = document.getElementById('journal-list'); if (box) box.innerHTML = journalListHtml(); return; }
  if (f === 'rperiod'){ S.ui.rperiod = t.value; const box = document.getElementById('report-body'); if (box) box.innerHTML = reportHtml(S.ui.rperiod); return; }
  if (f === 'jproc'){ S.ui.jproc = t.value; S.ui.jlimit = 60; const box = document.getElementById('journal-list'); if (box) box.innerHTML = journalListHtml(); return; }
  if (f === 'docproc'){ if (S.ui.modal){ S.ui.modal.proc = t.value; renderModal(); const sel = document.querySelector('#overlay [data-f="docproc"]'); if (sel) sel.focus(); } return; }
  if (f === 'pdc'){ const p = pat(t.dataset.pid); if (!p) return; p.pdConsentAt = t.checked ? todayIso() : ''; queue('patients', p); render(); return; }
  if (f === 'ptype'){
    const pl = planFor(t); if (!pl) return;
    pl.type = +t.value;
    if (pl.type > 0 && (!pl.from || pl.from < todayIso())){ pl.from = todayIso(); const d = document.querySelector('[data-f="pfrom"][data-plan="' + pl.id + '"]'); if (d) d.value = pl.from; }
    queue('plans', pl);
    const l = document.querySelector('[data-linked="' + pl.id + '"]'); if (l) l.textContent = linkedLine(pl);
    return;
  }
  const v = curVisit(); if (!v || v.status === 'done') return;
  if (f === 'check'){ v.checked[+t.dataset.i] = t.checked; queue('visits', v); refreshFinish(v); return; }
  if (f === 'consent'){ v.consent = t.checked; queue('visits', v); refreshFinish(v); return; }
}

const ENTER_ACT = {'su-name': 'su-next', 'su-doctor': 'su-next', 'su-pin': 'su-next', 'su-pin2': 'su-next', 'su-pw': 'su-finish', 'su-pw2': 'su-finish',
  'lk-pin': 'unlock', 'fg-pw': 'lk-reset', 'fg-pin': 'lk-reset', 'fg-pin2': 'lk-reset', 'rs-pw': 'restore', 'sp-cur': 'change-pin', 'sp-new': 'change-pin', 'sp-new2': 'change-pin',
  'sw-cur': 'change-pw', 'sw-new': 'change-pw', 'sw-new2': 'change-pw'};
function onKey(e){
  if (e.key === 'Escape' && S.ui.modal){ closeModal(); return; }
  if (e.key === 'Enter' && e.target.id && ENTER_ACT[e.target.id] && !e.isComposing){
    const btn = document.querySelector('[data-act="' + ENTER_ACT[e.target.id] + '"]');
    if (btn && !btn.disabled){ e.preventDefault(); if (e.target.dataset.sf) S.setup[e.target.dataset.sf] = e.target.value; btn.click(); }
    return;
  }
  const ta = e.target; if (!ta.dataset || !ta.dataset.tpl || ta.dataset.tpl !== TPL.kind || !TPL.items.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault(); const n = TPL.items.length;
    TPL.on = e.key === 'ArrowDown' ? (TPL.on + 1) % n : (TPL.on <= 0 ? n - 1 : TPL.on - 1); markTpl();
  } else if ((e.key === 'Enter' || e.key === 'Tab') && TPL.on >= 0){ e.preventDefault(); applyTpl(ta, TPL.items[TPL.on]); }
  else if (e.key === 'Escape'){ e.preventDefault(); hideTpl(); }
}

document.addEventListener('mousedown', e => { if (e.target.closest && e.target.closest('.tpl button')) e.preventDefault(); });
document.addEventListener('click', e => { onClick(e).catch(err => { console.error(err); toast('Ошибка: ' + (err.message || err)); }); });
document.addEventListener('input', onInput);
document.addEventListener('change', e => { onChange(e).catch(err => { console.error(err); toast('Ошибка: ' + (err.message || err)); }); });
document.addEventListener('keydown', onKey);
document.addEventListener('submit', e => e.preventDefault());
document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
window.addEventListener('pagehide', () => { flush(); });
window.addEventListener('beforeunload', e => { if (pending.size || inFlight){ flush(); e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; });

/* ---------- запуск ---------- */
function oneTab(){
  // Одна вкладка — одна программа: две открытые копии могли бы перезаписать друг другу данные.
  // При обновлении страницы старая вкладка отпускает замок не сразу, поэтому ждём до 3 секунд.
  if (!navigator.locks || !navigator.locks.request) return Promise.resolve(true);
  return new Promise(res => {
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), 3000);
    navigator.locks.request('kirenix-klinika-open', {signal: ac.signal}, () => {
      clearTimeout(timer); res(true);
      return new Promise(() => {});   // держим, пока открыта вкладка
    }).catch(err => { clearTimeout(timer); res(!(err && err.name === 'AbortError')); });
  });
}
async function boot(){
  S.ui = freshUi();
  // только защищённое соединение: по http страницу могли бы подменить по дороге
  if (location.protocol === 'http:' && !LOCAL){ location.replace('https://' + location.host + location.pathname + location.search); return; }
  // внутри чужого сайта (iframe) не работаем: так нельзя подсунуть программу под чужие кнопки
  let framed = true; try { framed = window.top !== window.self; } catch (e){}
  if (framed){ S.fatal = 'frame'; return render(); }
  if (!window.indexedDB || !window.crypto || !crypto.subtle){ S.fatal = 'browser'; return render(); }
  if (!(await oneTab())){ S.fatal = 'tab'; return render(); }
  try { await DB.open(); await loadLicense(); await loadSettings(); }
  catch (e){ console.error(e); S.fatal = 'db'; S.fatalMsg = String(e && e.message || e); return render(); }
  S.locked = !!S.settings;
  renderDatalists();
  render();
  checkStorage();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || LOCAL)){
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('sw', err));
  }
}
if (LOCAL) window.__kx = {S, flush, lockNow};   // только для проверок на этом компьютере
boot();
})();
